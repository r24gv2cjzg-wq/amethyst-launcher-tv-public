
name: Build Amethyst Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir source
          unzip AmethystLauncher-source.zip -d source

      - name: Fix JVM compatibility
        run: |
          APP_FILE=$(find source -path '*/app/build.gradle.kts' -print -quit)
          test -n "$APP_FILE"

          python3 - "$APP_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions {" not in s:
              needle = "    compileSdk = 35\n"
              addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              if needle not in s:
                  raise SystemExit("Could not find compileSdk = 35")
              s = s.replace(needle, needle + addition, 1)

          p.write_text(s)
          print("JVM compatibility fixed:", p)
          PY

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Launcher-debug
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
