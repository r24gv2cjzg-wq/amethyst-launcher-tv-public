        working-directory: amethyst
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Launcher-10.1
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
