name: Build Amethyst Launcher PS Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher

          cat > amethyst/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmethystLauncher"
          include(":app")
          EOF

          cat > amethyst/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > amethyst/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.amethyst.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.amethyst.launcher"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Amethyst Launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              private val bg = Color.rgb(7, 12, 30)
              private val cardColor = Color.rgb(23, 34, 66)
              private val accent = Color.rgb(92, 125, 255)
              private val white = Color.WHITE
              private val muted = Color.rgb(160, 174, 205)

              private lateinit var root: LinearLayout
              private lateinit var clock: TextView
              private lateinit var network: TextView
              private lateinit var scroll: HorizontalScrollView
              private lateinit var cards: LinearLayout

              private val handler = Handler(Looper.getMainLooper())

              private val clockRunnable = object : Runnable {
                  override fun run() {
                      if (::clock.isInitialized) {
                          clock.text = SimpleDateFormat(
                              "HH:mm  •  EEEE, d MMMM",
                              Locale.getDefault()
                          ).format(Date())
                      }

                      if (::network.isInitialized) {
                          network.text = if (isOnline()) "● ONLINE" else "● OFFLINE"
                          network.setTextColor(
                              if (isOnline()) Color.rgb(100, 220, 160)
                              else Color.rgb(255, 130, 130)
                          )
                      }

                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  buildUI()
                  handler.post(clockRunnable)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(clockRunnable)
                  super.onDestroy()
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun background(color: Int, radius: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                  }
              }

              private fun label(
                  text: String,
                  size: Float,
                  color: Int,
                  bold: Boolean = false
              ): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER_VERTICAL
                  }
              }

              private fun buildUI() {
                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(48), dp(24), dp(48), dp(24))
                      setBackgroundColor(bg)
                      isFocusable = true
                      isFocusableInTouchMode = true
                  }

                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val logo = label("AMETHYST", 25f, white, true)
                  top.addView(logo, LinearLayout.LayoutParams(0, dp(48), 1f))

                  network = label("● ONLINE", 13f, Color.GREEN, true)
                  top.addView(network)

                  clock = label("", 15f, muted)
                  clock.gravity = Gravity.CENTER
                  val clockParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      dp(48)
                  )
                  clockParams.marginStart = dp(28)
                  top.addView(clock, clockParams)

                  root.addView(top)

                  val heading = label("Добро пожаловать", 30f, white, true)
                  val headingParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(55)
                  )
                  headingParams.topMargin = dp(28)
                  root.addView(heading, headingParams)

                  val subtitle = label(
                      "Выберите приложение",
                      15f,
                      muted
                  )
                  root.addView(subtitle)

                  scroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipToPadding = false
                      setPadding(dp(4), dp(20), dp(4), dp(20))
                      descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  }

                  cards = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  scroll.addView(cards)
                  val scrollParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(230)
                  )
                  scrollParams.topMargin = dp(12)
                  root.addView(scroll, scrollParams)

                  val footer = label(
                      "AMETHYST LAUNCHER  •  ANDROID TV",
                      11f,
                      muted
                  )
                  footer.gravity = Gravity.CENTER
                  root.addView(footer)

                  setContentView(root)
                  loadApps()

                  root.post {
                      if (cards.childCount > 0) {
                          cards.getChildAt(0).requestFocus()
                      }
                  }
              }

              private fun loadApps() {
                  cards.removeAllViews()

                  addCard(
                      "⚙",
                      "Настройки",
                      "Система и Wi-Fi"
                  ) {
                      startActivity(Intent(android.provider.Settings.ACTION_SETTINGS))
                  }

                  val pm = packageManager
                  val found = mutableMapOf<String, android.content.pm.ResolveInfo>()

                  val categories = listOf(
                      Intent.CATEGORY_LEANBACK_LAUNCHER,
                      Intent.CATEGORY_LAUNCHER
                  )

                  for (category in categories) {
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(category)
                      val results = pm.queryIntentActivities(intent, 0)

                      for (result in results) {
                          val packageName = result.activityInfo.packageName
                          if (packageName != packageNameOfSelf()) {
                              found[packageName] = result
                          }
                      }
                  }

                  val apps = found.values.sortedBy {
                      it.loadLabel(pm).toString().lowercase()
                  }

                  for (app in apps) {
                      val name = app.loadLabel(pm).toString()
                      val icon = app.loadIcon(pm)
                      val packageName = app.activityInfo.packageName

                      addCard(name.take(1).uppercase(), name, "Запустить приложение", icon) {
                          val launch = pm.getLaunchIntentForPackage(packageName)
                          if (launch != null) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(launch)
                          }
                      }
                  }

                  addCard("↻", "Обновить", "Обновить список") {
                      loadApps()
                  }
              }

              private fun packageNameOfSelf(): String = packageName

              private fun addCard(
                  symbol: String,
                  title: String,
                  description: String,
                  icon: android.graphics.drawable.Drawable? = null,
                  action: () -> Unit
              ) {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(14), dp(12), dp(14))
                      background = background(cardColor, 18)
                      isFocusable = true
                      isFocusableInTouchMode = true
                      isClickable = true
                  }

                  val iconView = if (icon != null) {
                      android.widget.ImageView(this).apply {
                          setImageDrawable(icon)
                          scaleType = android.widget.ImageView.ScaleType.FIT_CENTER
                      }
                  } else {
                      TextView(this).apply {
                          text = symbol
                          textSize = 35f
                          setTextColor(white)
                          gravity = Gravity.CENTER
                          typeface = Typeface.DEFAULT_BOLD
                      }
                  }

                  tile.addView(
                      iconView,
                      LinearLayout.LayoutParams(dp(58), dp(58))
                  )

                  val titleView = label(title, 15f, white, true)
                  titleView.gravity = Gravity.CENTER
                  titleView.maxLines = 2
                  val titleParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(42)
                  )
                  titleParams.topMargin = dp(8)
                  tile.addView(titleView, titleParams)

                  val desc = label(description, 10f, muted)
                  desc.gravity = Gravity.CENTER
                  tile.addView(
                      desc,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(24)
                      )
                  )

                  tile.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.07f else 1f)
                          .scaleY(if (focused) 1.07f else 1f)
                          .setDuration(130)
                          .start()

                      view.background = background(
                          if (focused) accent else cardColor,
                          18
                      )

                      if (focused) {
                          scroll.smoothScrollTo(view.left - dp(20), 0)
                      }
                  }

                  tile.setOnClickListener { action() }

                  val params = LinearLayout.LayoutParams(dp(155), dp(185))
                  params.marginEnd = dp(18)
                  cards.addView(tile, params)
              }

              private fun isOnline(): Boolean {
                  val cm = getSystemService(CONNECTIVITY_SERVICE)
                      as ConnectivityManager
                  val network = cm.activeNetwork ?: return false
                  val capabilities = cm.getNetworkCapabilities(network)
                      ?: return false

                  return capabilities.hasCapability(
                      NetworkCapabilities.NET_CAPABILITY_INTERNET
                  )
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      startActivity(
                          Intent(android.provider.Settings.ACTION_SETTINGS)
                      )
                      return true
                  }

                  return super.onKeyDown(keyCode, event)
              }
          }
          EOF

      - name: Build APK
        run: |
          cd amethyst
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Launcher-PS-Edition
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
