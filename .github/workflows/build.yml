name: Amethyst TV OS 8.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project
        shell: bash
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher

          cat > amethyst/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmethystTV"
          include(":app")
          EOF

          cat > amethyst/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          cat > amethyst/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.amethyst.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.amethyst.launcher"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 8
                  versionName = "8.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Amethyst TV OS"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.tv.TvContract
          import android.media.tv.TvInputInfo
          import android.media.tv.TvInputManager
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import android.content.pm.ResolveInfo
          import android.text.TextUtils
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              private val backgroundColor = Color.rgb(5, 8, 17)
              private val white = Color.WHITE
              private val muted = Color.rgb(155, 170, 198)
              private val accent = Color.rgb(75, 145, 255)

              private lateinit var root: FrameLayout
              private lateinit var homePage: FrameLayout
              private lateinit var hdmiPage: FrameLayout
              private lateinit var heroTitle: TextView
              private lateinit var heroSubtitle: TextView
              private lateinit var clock: TextView

              private val apps = mutableListOf<AppEntry>()
              private val sources = mutableListOf<TvSource>()

              private var currentScreen = Screen.HOME
              private var selectedApp = 0
              private var pageHeight = 0
              private var animationRunning = false
              private var libraryOpen = false

              private enum class Screen {
                  HOME, HDMI
              }

              private data class AppEntry(
                  val name: String,
                  val packageName: String,
                  val icon: android.graphics.drawable.Drawable
              )

              private data class TvSource(
                  val name: String,
                  val description: String,
                  val inputId: String,
                  val isPlayStation: Boolean
              )

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun makeGradient(
                  colors: IntArray,
                  radius: Int = 0,
                  strokeColor: Int = Color.TRANSPARENT,
                  strokeWidth: Int = 0
              ): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      colors
                  ).apply {
                      cornerRadius = dp(radius).toFloat()

                      if (strokeWidth > 0) {
                          setStroke(dp(strokeWidth), strokeColor)
                      }
                  }
              }

              private fun label(
                  value: String,
                  size: Float,
                  color: Int = white,
                  bold: Boolean = false
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      gravity = Gravity.CENTER_VERTICAL

                      if (bold) {
                          setTypeface(null, Typeface.BOLD)
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = backgroundColor
                  window.navigationBarColor = backgroundColor

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  loadApps()
                  loadSources()
                  createInterface()
              }

              private fun loadApps() {
                  apps.clear()

                  val discovered =
                      linkedMapOf<String, ResolveInfo>()

                  val categories = listOf(
                      Intent.CATEGORY_LEANBACK_LAUNCHER,
                      Intent.CATEGORY_LAUNCHER
                  )

                  categories.forEach { category ->
                      val query = Intent(Intent.ACTION_MAIN)
                          .addCategory(category)

                      packageManager
                          .queryIntentActivities(query, 0)
                          .forEach { info ->
                              val packageName =
                                  info.activityInfo.packageName

                              if (packageName != packageNameOfSelf()) {
                                  discovered[packageName] = info
                              }
                          }
                  }

                  discovered.values
                      .sortedBy {
                          it.loadLabel(packageManager)
                              .toString()
                              .lowercase()
                      }
                      .forEach { info ->
                          apps.add(
                              AppEntry(
                                  info.loadLabel(packageManager).toString(),
                                  info.activityInfo.packageName,
                                  info.loadIcon(packageManager)
                              )
                          )
                      }
              }

              private fun packageNameOfSelf(): String =
                  "com.amethyst.launcher"

              private fun loadSources() {
                  sources.clear()

                  try {
                      val manager = getSystemService(
                          Context.TV_INPUT_SERVICE
                      ) as TvInputManager

                      val inputs = manager.tvInputList

                      val hdmiInputs = inputs
                          .filter {
                              it.type == TvInputInfo.TYPE_HDMI &&
                              !it.id.contains("HDMI300004")
                          }
                          .sortedBy { info ->
                              Regex("HW(\\d+)$")
                                  .find(info.id)
                                  ?.groupValues
                                  ?.getOrNull(1)
                                  ?.toIntOrNull()
                                  ?: 99
                          }

                      val cecDevice = inputs.firstOrNull {
                          it.id.contains("HDMI300004")
                      }

                      hdmiInputs.forEachIndexed { index, info ->
                          val port = index + 1

                          val isPlayStation =
                              port == 3 &&
                              cecDevice != null &&
                              cecDevice.loadLabel(this)
                                  .toString()
                                  .contains("PlayStation", true)

                          sources.add(
                              TvSource(
                                  name = if (isPlayStation) {
                                      "PlayStation 5"
                                  } else {
                                      "HDMI $port"
                                  },
                                  description = if (isPlayStation) {
                                      "ИГРОВАЯ КОНСОЛЬ  •  HDMI 3"
                                  } else {
                                      "ВХОД HDMI  •  ПОРТ $port"
                                  },
                                  inputId = info.id,
                                  isPlayStation = isPlayStation
                              )
                          )
                      }
                  } catch (_: Exception) {
                      sources.clear()
                  }
              }

              private fun createInterface() {
                  root = FrameLayout(this).apply {
                      setBackgroundColor(backgroundColor)
                      clipChildren = false
                      clipToPadding = false
                  }

                  homePage = FrameLayout(this)
                  hdmiPage = FrameLayout(this)

                  root.addView(
                      homePage,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  root.addView(
                      hdmiPage,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  buildHome()
                  buildHdmi()

                  setContentView(root)

                  root.post {
                      pageHeight = root.height

                      homePage.translationY = 0f
                      hdmiPage.translationY = pageHeight.toFloat()

                      homePage.requestFocus()
                  }
              }

              private fun pageBackground(): View {
                  return View(this).apply {
                      background = makeGradient(
                          intArrayOf(
                              Color.rgb(23, 48, 93),
                              Color.rgb(12, 23, 47),
                              Color.rgb(5, 8, 17)
                          )
                      )
                  }
              }

              private fun buildHome() {
                  homePage.addView(
                      pageBackground(),
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val glow = View(this).apply {
                      background = makeGradient(
                          intArrayOf(
                              Color.argb(65, 35, 100, 220),
                              Color.argb(0, 35, 100, 220)
                          )
                      )
                  }

                  homePage.addView(
                      glow,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(68), dp(28),
                          dp(68), dp(28)
                      )
                  }

                  homePage.addView(
                      content,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  buildHeader(content, false)

                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val eyebrow = label(
                      "AMETHYST  /  HOME",
                      11f,
                      Color.rgb(151, 190, 255),
                      true
                  )

                  hero.addView(eyebrow)

                  heroTitle = label(
                      "ТВОИ ИГРЫ",
                      38f,
                      white,
                      true
                  )

                  hero.addView(
                      heroTitle,
                      LinearLayout.LayoutParams(-1, dp(62))
                  )

                  heroSubtitle = label(
                      "Выбери приложение, чтобы продолжить",
                      15f,
                      muted
                  )

                  hero.addView(heroSubtitle)

                  val heroParams =
                      LinearLayout.LayoutParams(-1, dp(150))
                  heroParams.topMargin = dp(24)

                  content.addView(hero, heroParams)

                  val railHeader = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  railHeader.addView(
                      label(
                          "УСТАНОВЛЕННЫЕ ПРИЛОЖЕНИЯ",
                          12f,
                          muted,
                          true
                      ),
                      LinearLayout.LayoutParams(0, dp(38), 1f)
                  )

                  railHeader.addView(
                      label(
                          "${apps.size} ПРИЛОЖЕНИЙ",
                          10f,
                          muted,
                          true
                      )
                  )

                  content.addView(railHeader)

                  val scroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipChildren = false
                      clipToPadding = false
                      setPadding(dp(8), dp(18), dp(40), dp(24))
                  }

                  val rail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  apps.take(16).forEachIndexed { index, app ->
                      val tile = createAppTile(app, index)

                      rail.addView(
                          tile,
                          LinearLayout.LayoutParams(
                              dp(178),
                              dp(194)
                          ).apply {
                              marginEnd = dp(20)
                          }
                      )
                  }

                  scroll.addView(rail)

                  content.addView(
                      scroll,
                      LinearLayout.LayoutParams(-1, dp(235))
                  )

                  if (apps.isEmpty()) {
                      content.addView(
                          label(
                              "Не удалось обнаружить приложения",
                              15f,
                              muted
                          )
                      )
                  }

                  val footer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  footer.addView(
                      label(
                          "↓  ИСТОЧНИКИ HDMI",
                          12f,
                          Color.rgb(190, 210, 245),
                          true
                      ),
                      LinearLayout.LayoutParams(0, dp(48), 1f)
                  )

                  val library = label(
                      "БИБЛИОТЕКА  →",
                      11f,
                      muted,
                      true
                  ).apply {
                      isFocusable = true
                      setOnClickListener {
                          openLibrary()
                      }
                  }

                  footer.addView(library)

                  content.addView(
                      footer,
                      LinearLayout.LayoutParams(-1, dp(48))
                  )
              }

              private fun buildHeader(
                  parent: LinearLayout,
                  hdmi: Boolean
              ) {
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val brand = label(
                      "AMETHYST",
                      21f,
                      white,
                      true
                  )

                  header.addView(
                      brand,
                      LinearLayout.LayoutParams(0, dp(48), 1f)
                  )

                  header.addView(
                      label(
                          if (hdmi) "INPUT SELECT" else "GAMES",
                          10f,
                          muted,
                          true
                      )
                  )

                  val time = SimpleDateFormat(
                      "HH:mm",
                      Locale.getDefault()
                  ).format(Date())

                  clock = label(
                      time,
                      17f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  val timeParams =
                      LinearLayout.LayoutParams(dp(75), dp(48))
                  timeParams.marginStart = dp(25)

                  header.addView(clock, timeParams)

                  parent.addView(header)
              }

              private fun createAppTile(
                  app: AppEntry,
                  index: Int
              ): View {
                  val tile = FrameLayout(this).apply {
                      isFocusable = true
                      isClickable = true
                      clipChildren = false
                      clipToPadding = false
                      background = makeGradient(
                          intArrayOf(
                              Color.rgb(31, 48, 78),
                              Color.rgb(13, 22, 42)
                          ),
                          10
                      )
                  }

                  val inner = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                  }

                  val icon = ImageView(this).apply {
                      setImageDrawable(app.icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }

                  inner.addView(
                      icon,
                      LinearLayout.LayoutParams(dp(82), dp(82))
                  )

                  val name = label(
                      app.name,
                      13f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                  }

                  val nameParams =
                      LinearLayout.LayoutParams(-1, dp(52))
                  nameParams.topMargin = dp(12)

                  inner.addView(name, nameParams)

                  tile.addView(
                      inner,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  tile.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.09f else 1f)
                          .scaleY(if (focused) 1.09f else 1f)
                          .translationY(if (focused) -dp(5).toFloat() else 0f)
                          .setDuration(170)
                          .setInterpolator(DecelerateInterpolator())
                          .start()

                      view.background = if (focused) {
                          makeGradient(
                              intArrayOf(
                                  Color.rgb(42, 92, 173),
                                  Color.rgb(15, 38, 82)
                              ),
                              10,
                              Color.rgb(112, 177, 255),
                              2
                          )
                      } else {
                          makeGradient(
                              intArrayOf(
                                  Color.rgb(31, 48, 78),
                                  Color.rgb(13, 22, 42)
                              ),
                              10
                          )
                      }

                      if (focused) {
                          selectedApp = index
                          heroTitle.text = app.name
                          heroSubtitle.text = app.packageName
                      }
                  }

                  tile.setOnClickListener {
                      launchApp(app)
                  }

                  tile.setOnKeyListener { _, keyCode, event ->
                      if (
                          keyCode == KeyEvent.KEYCODE_DPAD_DOWN &&
                          event.action == KeyEvent.ACTION_DOWN
                      ) {
                          slideToHdmi()
                          true
                      } else {
                          false
                      }
                  }

                  return tile
              }

              private fun buildHdmi() {
                  hdmiPage.addView(
                      View(this).apply {
                          background = makeGradient(
                              intArrayOf(
                                  Color.rgb(8, 18, 39),
                                  Color.rgb(5, 8, 17),
                                  Color.rgb(3, 5, 12)
                              )
                          )
                      },
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val glow = View(this).apply {
                      background = makeGradient(
                          intArrayOf(
                              Color.argb(65, 20, 85, 190),
                              Color.argb(0, 20, 85, 190)
                          )
                      )
                  }

                  hdmiPage.addView(
                      glow,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(68), dp(28),
                          dp(68), dp(28)
                      )
                  }

                  hdmiPage.addView(
                      content,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  buildHeader(content, true)

                  val title = label(
                      "Выбор источника",
                      37f,
                      white,
                      true
                  )

                  val titleParams =
                      LinearLayout.LayoutParams(-1, dp(65))
                  titleParams.topMargin = dp(35)

                  content.addView(title, titleParams)

                  content.addView(
                      label(
                          "Выбери устройство, подключённое к телевизору",
                          15f,
                          muted
                      )
                  )

                  val rail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  sources.forEachIndexed { index, source ->
                      rail.addView(
                          createSourceTile(source, index),
                          LinearLayout.LayoutParams(
                              0,
                              dp(215),
                              1f
                          ).apply {
                              marginEnd = dp(20)
                          }
                      )
                  }

                  val railParams =
                      LinearLayout.LayoutParams(-1, dp(245))
                  railParams.topMargin = dp(34)

                  content.addView(rail, railParams)

                  if (sources.isEmpty()) {
                      content.addView(
                          label(
                              "HDMI-входы не обнаружены",
                              16f,
                              muted
                          )
                      )
                  }

                  content.addView(
                      label(
                          "↑  ВЕРНУТЬСЯ К ГЛАВНОМУ ЭКРАНУ",
                          11f,
                          Color.rgb(190, 210, 245),
                          true
                      ),
                      LinearLayout.LayoutParams(-1, dp(55))
                  )
              }

              private fun createSourceTile(
                  source: TvSource,
                  index: Int
              ): View {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      isFocusable = true
                      isClickable = true
                      setPadding(
                          dp(16), dp(15),
                          dp(16), dp(15)
                      )

                      background = makeGradient(
                          intArrayOf(
                              Color.rgb(25, 40, 66),
                              Color.rgb(10, 17, 33)
                          ),
                          8
                      )
                  }

                  val symbol = label(
                      if (source.isPlayStation) "PS5" else "HDMI",
                      if (source.isPlayStation) 34f else 27f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  tile.addView(
                      symbol,
                      LinearLayout.LayoutParams(-1, dp(80))
                  )

                  val name = label(
                      source.name,
                      20f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                      maxLines = 2
                  }

                  tile.addView(
                      name,
                      LinearLayout.LayoutParams(-1, dp(55))
                  )

                  val description = label(
                      source.description,
                      9f,
                      muted,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                  }

                  tile.addView(description)

                  tile.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.075f else 1f)
                          .scaleY(if (focused) 1.075f else 1f)
                          .setDuration(170)
                          .setInterpolator(DecelerateInterpolator())
                          .start()

                      view.background = if (focused) {
                          makeGradient(
                              intArrayOf(
                                  Color.rgb(48, 100, 185),
                                  Color.rgb(17, 39, 82)
                              ),
                              8,
                              Color.rgb(120, 185, 255),
                              3
                          )
                      } else {
                          makeGradient(
                              intArrayOf(
                                  Color.rgb(25, 40, 66),
                                  Color.rgb(10, 17, 33)
                              ),
                              8
                          )
                      }
                  }

                  tile.setOnClickListener {
                      switchInput(source)
                  }

                  tile.setOnKeyListener { _, keyCode, event ->
                      if (
                          keyCode == KeyEvent.KEYCODE_DPAD_UP &&
                          event.action == KeyEvent.ACTION_DOWN
                      ) {
                          slideToHome()
                          true
                      } else {
                          false
                      }
                  }

                  return tile
              }

              private fun slideToHdmi() {
                  if (
                      currentScreen == Screen.HDMI ||
                      animationRunning ||
                      libraryOpen
                  ) return

                  if (pageHeight <= 0) {
                      pageHeight = root.height
                  }

                  if (pageHeight <= 0) return

                  animationRunning = true
                  currentScreen = Screen.HDMI

                  hdmiPage.translationY = pageHeight.toFloat()

                  homePage.animate()
                      .translationY(-pageHeight.toFloat())
                      .setDuration(420)
                      .setInterpolator(DecelerateInterpolator())
                      .start()

                  hdmiPage.animate()
                      .translationY(0f)
                      .setDuration(420)
                      .setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          animationRunning = false
                          hdmiPage.requestFocus()

                          if (hdmiPage.isFocusable) {
                              hdmiPage.isFocusable = true
                          }

                          focusFirstSource()
                      }
                      .start()
              }

              private fun slideToHome() {
                  if (
                      currentScreen == Screen.HOME ||
                      animationRunning ||
                      libraryOpen
                  ) return

                  animationRunning = true
                  currentScreen = Screen.HOME

                  homePage.animate()
                      .translationY(0f)
                      .setDuration(420)
                      .setInterpolator(DecelerateInterpolator())
                      .start()

                  hdmiPage.animate()
                      .translationY(pageHeight.toFloat())
                      .setDuration(420)
                      .setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          animationRunning = false
                          focusFirstApp()
                      }
                      .start()
              }

              private fun focusFirstApp() {
                  val scroll = findFirstFocusable(homePage)
                  scroll?.requestFocus()
              }

              private fun focusFirstSource() {
                  val first = findFirstFocusable(hdmiPage)
                  first?.requestFocus()
              }

              private fun findFirstFocusable(view: View): View? {
                  if (
                      view.isFocusable &&
                      view !== homePage &&
                      view !== hdmiPage
                  ) return view

                  if (view is ViewGroup) {
                      for (i in 0 until view.childCount) {
                          val result = findFirstFocusable(
                              view.getChildAt(i)
                          )

                          if (result != null) return result
                      }
                  }

                  return null
              }

              private fun launchApp(app: AppEntry) {
                  try {
                      val intent =
                          packageManager.getLaunchIntentForPackage(
                              app.packageName
                          )

                      if (intent != null) {
                          startActivity(intent)
                      } else {
                          Toast.makeText(
                              this,
                              "Не удалось открыть приложение",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Ошибка запуска приложения",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun switchInput(source: TvSource) {
                  try {
                      val uri =
                          TvContract.buildChannelUriForPassthroughInput(
                              source.inputId
                          )

                      startActivity(
                          Intent(Intent.ACTION_VIEW, uri)
                      )
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Телевизор не разрешил переключить HDMI напрямую",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun openLibrary() {
                  if (libraryOpen) return

                  libraryOpen = true

                  val library = FrameLayout(this)

                  library.addView(
                      View(this).apply {
                          background = makeGradient(
                              intArrayOf(
                                  Color.rgb(17, 37, 75),
                                  Color.rgb(5, 8, 17)
                              )
                          )
                      },
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(60), dp(25),
                          dp(60), dp(25)
                      )
                  }

                  library.addView(
                      content,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  header.addView(
                      label(
                          "БИБЛИОТЕКА",
                          24f,
                          white,
                          true
                      ),
                      LinearLayout.LayoutParams(0, dp(60), 1f)
                  )

                  val back = label(
                      "← НАЗАД",
                      12f,
                      muted,
                      true
                  ).apply {
                      isFocusable = true
                      setOnClickListener {
                          closeLibrary()
                      }
                  }

                  header.addView(back)
                  content.addView(header)

                  content.addView(
                      label(
                          "${apps.size} УСТАНОВЛЕННЫХ ПРИЛОЖЕНИЙ",
                          11f,
                          muted,
                          true
                      )
                  )

                  val scroll = ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false
                  }

                  val grid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  apps.forEachIndexed { index, app ->
                      if (index % 5 == 0) {
                          grid.addView(
                              LinearLayout(this).apply {
                                  orientation = LinearLayout.HORIZONTAL
                                  gravity = Gravity.CENTER_VERTICAL
                              },
                              LinearLayout.LayoutParams(-1, dp(175))
                          )
                      }

                      val row = grid.getChildAt(
                          grid.childCount - 1
                      ) as LinearLayout

                      val tile = createAppTile(app, index)

                      row.addView(
                          tile,
                          LinearLayout.LayoutParams(
                              0,
                              dp(150),
                              1f
                          ).apply {
                              marginEnd = dp(12)
                          }
                      )
                  }

                  scroll.addView(grid)

                  content.addView(
                      scroll,
                      LinearLayout.LayoutParams(-1, 0, 1f)
                  )

                  root.addView(
                      library,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  library.tag = "library_overlay"
                  back.requestFocus()
              }

              private fun closeLibrary() {
                  val overlay =
                      root.findViewWithTag<View>("library_overlay")

                  if (overlay != null) {
                      root.removeView(overlay)
                  }

                  libraryOpen = false
                  focusFirstApp()
              }

              override fun onKeyDown(
                  keyCode: Int,
                  event: KeyEvent?
              ): Boolean {
                  if (libraryOpen) {
                      if (keyCode == KeyEvent.KEYCODE_BACK) {
                          closeLibrary()
                          return true
                      }

                      return super.onKeyDown(keyCode, event)
                  }

                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (currentScreen == Screen.HDMI) {
                          slideToHome()
                          return true
                      }
                  }

                  if (
                      keyCode == KeyEvent.KEYCODE_DPAD_DOWN &&
                      currentScreen == Screen.HOME
                  ) {
                      slideToHdmi()
                      return true
                  }

                  if (
                      keyCode == KeyEvent.KEYCODE_DPAD_UP &&
                      currentScreen == Screen.HDMI
                  ) {
                      slideToHome()
                      return true
                  }

                  return super.onKeyDown(keyCode, event)
              }

              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (libraryOpen) {
                      closeLibrary()
                  } else if (currentScreen == Screen.HDMI) {
                      slideToHome()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd amethyst
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-TV-OS-v8
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
