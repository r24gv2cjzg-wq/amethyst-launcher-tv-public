name: Amethyst TV OS 7.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project
        shell: bash
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher

          cat > amethyst/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmethystTV"
          include(":app")
          EOF

          cat > amethyst/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          cat > amethyst/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.amethyst.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.amethyst.launcher"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 7
                  versionName = "7.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Amethyst TV OS"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.tv.TvContract
          import android.media.tv.TvInputInfo
          import android.media.tv.TvInputManager
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import android.content.pm.ResolveInfo
          import android.text.TextUtils
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var root: FrameLayout
              private lateinit var page: LinearLayout
              private lateinit var background: View
              private lateinit var clock: TextView

              private val apps = mutableListOf<AppEntry>()
              private val sources = mutableListOf<TvSource>()

              private var currentPage = Screen.HOME
              private var selectedApp = 0

              private val dark = Color.rgb(5, 8, 18)
              private val white = Color.WHITE
              private val muted = Color.rgb(160, 174, 202)
              private val blue = Color.rgb(75, 130, 255)

              private enum class Screen {
                  HOME, HDMI, LIBRARY
              }

              private data class AppEntry(
                  val name: String,
                  val packageName: String,
                  val icon: android.graphics.drawable.Drawable
              )

              private data class TvSource(
                  val name: String,
                  val subtitle: String,
                  val inputId: String,
                  val symbol: String
              )

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun gradient(
                  colors: IntArray,
                  radius: Int = 0
              ) = GradientDrawable(
                  GradientDrawable.Orientation.TL_BR,
                  colors
              ).apply {
                  cornerRadius = dp(radius).toFloat()
              }

              private fun text(
                  value: String,
                  size: Float,
                  color: Int = white,
                  bold: Boolean = false
              ) = TextView(this).apply {
                  text = value
                  textSize = size
                  setTextColor(color)
                  gravity = Gravity.CENTER_VERTICAL
                  if (bold) setTypeface(null, Typeface.BOLD)
              }

              private fun focusStyle(
                  view: View,
                  radius: Int = 12
              ) {
                  view.isFocusable = true
                  view.isClickable = true

                  view.setOnFocusChangeListener { v, focused ->
                      v.animate()
                          .scaleX(if (focused) 1.045f else 1f)
                          .scaleY(if (focused) 1.045f else 1f)
                          .alpha(if (focused) 1f else 0.88f)
                          .setDuration(150)
                          .start()

                      if (v is TextView) {
                          v.setTextColor(
                              if (focused) white else muted
                          )
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = dark
                  window.navigationBarColor = dark

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  loadApps()
                  loadSources()
                  showScreen(Screen.HOME)
              }

              private fun loadApps() {
                  apps.clear()

                  val found = linkedMapOf<String, ResolveInfo>()

                  val categories = listOf(
                      Intent.CATEGORY_LEANBACK_LAUNCHER,
                      Intent.CATEGORY_LAUNCHER
                  )

                  categories.forEach { category ->
                      val query = Intent(Intent.ACTION_MAIN)
                          .addCategory(category)

                      packageManager
                          .queryIntentActivities(query, 0)
                          .forEach { info ->
                              val pkg = info.activityInfo.packageName

                              if (pkg != packageName) {
                                  found[pkg] = info
                              }
                          }
                  }

                  found.values
                      .sortedBy {
                          it.loadLabel(packageManager)
                              .toString()
                              .lowercase()
                      }
                      .forEach { info ->
                          apps.add(
                              AppEntry(
                                  info.loadLabel(packageManager).toString(),
                                  info.activityInfo.packageName,
                                  info.loadIcon(packageManager)
                              )
                          )
                      }
              }

              private fun loadSources() {
                  sources.clear()

                  try {
                      val manager = getSystemService(
                          Context.TV_INPUT_SERVICE
                      ) as TvInputManager

                      val inputs = manager.tvInputList

                      val physical = inputs
                          .filter {
                              it.type == TvInputInfo.TYPE_HDMI &&
                              !it.id.contains("HDMI300004")
                          }
                          .sortedBy { info ->
                              Regex("HW(\\d+)$")
                                  .find(info.id)
                                  ?.groupValues
                                  ?.getOrNull(1)
                                  ?.toIntOrNull()
                                  ?: 99
                          }

                      val cec = inputs.firstOrNull {
                          it.id.contains("HDMI300004")
                      }

                      physical.forEachIndexed { index, info ->
                          val port = index + 1

                          // FIX: loadLabel() requires Context, not PackageManager.
                          val label = info.loadLabel(this)
                              .toString()

                          val ps5 = port == 3 &&
                              cec != null &&
                              cec.loadLabel(this)
                                  .toString()
                                  .contains("PlayStation", true)

                          sources.add(
                              TvSource(
                                  name = if (ps5) {
                                      "PlayStation 5"
                                  } else {
                                      "HDMI $port"
                                  },
                                  subtitle = if (ps5) {
                                      "HDMI 3  •  ОБНАРУЖЕНО ПО HDMI-CEC"
                                  } else {
                                      label.uppercase(Locale.getDefault())
                                  },
                                  inputId = info.id,
                                  symbol = if (ps5) "PS5" else "HDMI"
                              )
                          )
                      }
                  } catch (_: Exception) {
                      sources.clear()
                  }

                  if (sources.isEmpty()) {
                      Toast.makeText(
                          this,
                          "Не удалось получить список HDMI-входов",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun showScreen(screen: Screen) {
                  currentPage = screen

                  root = FrameLayout(this)

                  background = View(this).apply {
                      this.background = gradient(
                          intArrayOf(
                              Color.rgb(20, 48, 105),
                              Color.rgb(10, 18, 43),
                              dark
                          )
                      )
                  }

                  root.addView(
                      background,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val shade = View(this).apply {
                      this.background = gradient(
                          intArrayOf(
                              Color.argb(20, 0, 0, 0),
                              Color.argb(95, 0, 0, 0),
                              Color.argb(220, 0, 0, 0)
                          )
                      )
                  }

                  root.addView(
                      shade,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(66), dp(22),
                          dp(66), dp(20)
                      )
                  }

                  root.addView(
                      page,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  createHeader()

                  when (screen) {
                      Screen.HOME -> createHome()
                      Screen.HDMI -> createHdmi()
                      Screen.LIBRARY -> createLibrary()
                  }

                  createDock()

                  setContentView(root)

                  page.post {
                      when (screen) {
                          Screen.HOME -> {
                              page.findViewWithTag<View>("first_app")
                                  ?.requestFocus()
                                  ?: page.findViewWithTag<View>("dock_hdmi")
                                      ?.requestFocus()
                          }

                          Screen.HDMI -> {
                              page.findViewWithTag<View>("first_source")
                                  ?.requestFocus()
                                  ?: page.findViewWithTag<View>("dock_home")
                                      ?.requestFocus()
                          }

                          Screen.LIBRARY -> {
                              page.findViewWithTag<View>("first_library")
                                  ?.requestFocus()
                                  ?: page.findViewWithTag<View>("dock_home")
                                      ?.requestFocus()
                          }
                      }
                  }
              }

              private fun createHeader() {
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val brand = text(
                      "AMETHYST",
                      22f,
                      white,
                      true
                  )

                  header.addView(
                      brand,
                      LinearLayout.LayoutParams(0, dp(52), 1f)
                  )

                  val status = text(
                      "TV OS 7.0",
                      11f,
                      muted,
                      true
                  )

                  header.addView(
                      status,
                      LinearLayout.LayoutParams(-2, dp(52))
                  )

                  clock = text(
                      SimpleDateFormat(
                          "HH:mm",
                          Locale.getDefault()
                      ).format(Date()),
                      16f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  val clockParams =
                      LinearLayout.LayoutParams(dp(75), dp(52))
                  clockParams.marginStart = dp(25)

                  header.addView(clock, clockParams)

                  page.addView(header)
              }

              private fun createHome() {
                  val intro = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val eyebrow = text(
                      "ТВОЁ ПРОСТРАНСТВО",
                      11f,
                      Color.rgb(164, 195, 255),
                      true
                  )

                  intro.addView(eyebrow)

                  val heading = text(
                      "Игры и развлечения",
                      34f,
                      white,
                      true
                  )

                  val headingParams =
                      LinearLayout.LayoutParams(-1, dp(55))
                  headingParams.topMargin = dp(5)

                  intro.addView(heading, headingParams)

                  val description = text(
                      "Всё установленное — в одном месте",
                      14f,
                      muted
                  )

                  intro.addView(description)

                  val introParams =
                      LinearLayout.LayoutParams(-1, dp(115))
                  introParams.topMargin = dp(20)

                  page.addView(intro, introParams)

                  val section = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val sectionTitle = text(
                      "ТВОИ ПРИЛОЖЕНИЯ",
                      12f,
                      muted,
                      true
                  )

                  section.addView(
                      sectionTitle,
                      LinearLayout.LayoutParams(0, dp(36), 1f)
                  )

                  section.addView(
                      text("${apps.size} ПРИЛОЖЕНИЙ", 10f, muted, true)
                  )

                  page.addView(section)

                  val scroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipChildren = false
                      clipToPadding = false
                      setPadding(dp(8), dp(15), dp(30), dp(20))
                  }

                  val rail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  apps.take(14).forEachIndexed { index, app ->
                      rail.addView(
                          createAppTile(app, index, false),
                          LinearLayout.LayoutParams(
                              dp(166),
                              dp(188)
                          ).apply {
                              marginEnd = dp(19)
                          }
                      )
                  }

                  scroll.addView(rail)

                  val scrollParams =
                      LinearLayout.LayoutParams(-1, dp(225))
                  page.addView(scroll, scrollParams)

                  if (apps.isEmpty()) {
                      val empty = text(
                          "Приложения не найдены",
                          16f,
                          muted
                      )
                      page.addView(empty)
                  }

                  val hint = text(
                      "↓  ИСТОЧНИКИ HDMI     •     БИБЛИОТЕКА",
                      11f,
                      Color.rgb(180, 198, 231),
                      true
                  )

                  val hintParams =
                      LinearLayout.LayoutParams(-1, dp(40))
                  hintParams.topMargin = dp(4)
                  page.addView(hint, hintParams)
              }

              private fun createAppTile(
                  app: AppEntry,
                  index: Int,
                  library: Boolean
              ): View {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(10), dp(10), dp(10), dp(8))
                      background = gradient(
                          intArrayOf(
                              Color.rgb(27, 42, 70),
                              Color.rgb(12, 19, 36)
                          ),
                          13
                      )
                  }

                  focusStyle(tile)
                  tile.tag = if (library && index == 0) {
                      "first_library"
                  } else if (!library && index == 0) {
                      "first_app"
                  } else {
                      "app_$index"
                  }

                  val icon = ImageView(this).apply {
                      setImageDrawable(app.icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }

                  tile.addView(
                      icon,
                      LinearLayout.LayoutParams(
                          dp(82),
                          dp(82)
                      )
                  )

                  val name = text(
                      app.name,
                      12f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                  }

                  val nameParams =
                      LinearLayout.LayoutParams(-1, dp(48))
                  nameParams.topMargin = dp(10)

                  tile.addView(name, nameParams)

                  tile.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.07f else 1f)
                          .scaleY(if (focused) 1.07f else 1f)
                          .setDuration(150)
                          .start()

                      view.background = gradient(
                          if (focused) {
                              intArrayOf(
                                  Color.rgb(53, 102, 190),
                                  Color.rgb(22, 43, 89)
                              )
                          } else {
                              intArrayOf(
                                  Color.rgb(27, 42, 70),
                                  Color.rgb(12, 19, 36)
                              )
                          },
                          13
                      )
                  }

                  tile.setOnClickListener {
                      launchApp(app)
                  }

                  return tile
              }

              private fun createHdmi() {
                  val heading = text(
                      "Источники сигнала",
                      34f,
                      white,
                      true
                  )

                  val headingParams =
                      LinearLayout.LayoutParams(-1, dp(65))
                  headingParams.topMargin = dp(25)

                  page.addView(heading, headingParams)

                  page.addView(
                      text(
                          "Выбери устройство, подключённое к телевизору",
                          14f,
                          muted
                      )
                  )

                  val list = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  sources.forEachIndexed { index, source ->
                      val card = createSourceTile(source, index)

                      val params =
                          LinearLayout.LayoutParams(0, dp(205), 1f)
                      params.marginEnd = dp(18)

                      list.addView(card, params)
                  }

                  val listParams =
                      LinearLayout.LayoutParams(-1, dp(230))
                  listParams.topMargin = dp(32)

                  page.addView(list, listParams)

                  if (sources.isEmpty()) {
                      page.addView(
                          text(
                              "Телевизор не предоставил список HDMI-входов",
                              15f,
                              muted
                          )
                      )
                  }

                  page.addView(
                      text(
                          "Нажми ✕, чтобы открыть выбранный источник",
                          12f,
                          muted
                      )
                  )
              }

              private fun createSourceTile(
                  source: TvSource,
                  index: Int
              ): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(18), dp(15), dp(18), dp(15))
                      background = gradient(
                          intArrayOf(
                              Color.rgb(28, 42, 68),
                              Color.rgb(12, 19, 36)
                          ),
                          15
                      )
                  }

                  focusStyle(card)

                  if (index == 0) card.tag = "first_source"

                  val symbol = text(
                      source.symbol,
                      if (source.symbol == "PS5") 31f else 25f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  card.addView(
                      symbol,
                      LinearLayout.LayoutParams(-1, dp(75))
                  )

                  val name = text(
                      source.name,
                      19f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                      maxLines = 2
                  }

                  card.addView(
                      name,
                      LinearLayout.LayoutParams(-1, dp(55))
                  )

                  val subtitle = text(
                      source.subtitle,
                      9f,
                      muted,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                      maxLines = 2
                  }

                  card.addView(subtitle)

                  card.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.055f else 1f)
                          .scaleY(if (focused) 1.055f else 1f)
                          .setDuration(150)
                          .start()

                      view.background = gradient(
                          if (focused) {
                              intArrayOf(
                                  Color.rgb(49, 102, 194),
                                  Color.rgb(19, 44, 99)
                              )
                          } else {
                              intArrayOf(
                                  Color.rgb(28, 42, 68),
                                  Color.rgb(12, 19, 36)
                              )
                          },
                          15
                      )
                  }

                  card.setOnClickListener {
                      switchInput(source)
                  }

                  return card
              }

              private fun switchInput(source: TvSource) {
                  try {
                      val uri =
                          TvContract.buildChannelUriForPassthroughInput(
                              source.inputId
                          )

                      val intent = Intent(
                          Intent.ACTION_VIEW,
                          uri
                      ).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }

                      startActivity(intent)
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Прошивка не разрешила переключить вход напрямую",
                          Toast.LENGTH_LONG
                      ).show()

                      try {
                          startActivity(
                              Intent(
                                  android.provider.Settings.ACTION_SETTINGS
                              )
                          )
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun createLibrary() {
                  val heading = text(
                      "Библиотека",
                      34f,
                      white,
                      true
                  )

                  val headingParams =
                      LinearLayout.LayoutParams(-1, dp(70))
                  headingParams.topMargin = dp(20)

                  page.addView(heading, headingParams)

                  page.addView(
                      text(
                          "${apps.size} установленных приложений",
                          14f,
                          muted
                      )
                  )

                  val scroll = ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false
                  }

                  val grid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val columns = 5

                  apps.forEachIndexed { index, app ->
                      if (index % columns == 0) {
                          grid.addView(
                              LinearLayout(this).apply {
                                  orientation = LinearLayout.HORIZONTAL
                                  gravity = Gravity.CENTER_VERTICAL
                              },
                              LinearLayout.LayoutParams(-1, dp(180))
                          )
                      }

                      val row = grid.getChildAt(
                          grid.childCount - 1
                      ) as LinearLayout

                      row.addView(
                          createAppTile(app, index, true),
                          LinearLayout.LayoutParams(
                              0,
                              dp(160),
                              1f
                          ).apply {
                              marginEnd = dp(13)
                          }
                      )
                  }

                  scroll.addView(grid)

                  page.addView(
                      scroll,
                      LinearLayout.LayoutParams(-1, 0, 1f)
                  )
              }

              private fun createDock() {
                  val dock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = gradient(
                          intArrayOf(
                              Color.argb(210, 20, 29, 49),
                              Color.argb(225, 9, 14, 27)
                          ),
                          18
                      )
                      setPadding(dp(12), dp(5), dp(12), dp(5))
                  }

                  val items = listOf(
                      Triple("⌂", "ГЛАВНАЯ", Screen.HOME),
                      Triple("▣", "HDMI", Screen.HDMI),
                      Triple("▤", "БИБЛИОТЕКА", Screen.LIBRARY)
                  )

                  items.forEach { item ->
                      val button = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER
                          setPadding(dp(20), dp(8), dp(20), dp(8))
                      }

                      val symbol = text(
                          item.first,
                          19f,
                          white,
                          true
                      )

                      button.addView(symbol)

                      val name = text(
                          item.second,
                          11f,
                          muted,
                          true
                      )

                      val nameParams =
                          LinearLayout.LayoutParams(-2, dp(36))
                      nameParams.marginStart = dp(9)

                      button.addView(name, nameParams)

                      focusStyle(button)

                      button.tag = when (item.third) {
                          Screen.HOME -> "dock_home"
                          Screen.HDMI -> "dock_hdmi"
                          Screen.LIBRARY -> "dock_library"
                      }

                      button.setOnClickListener {
                          if (currentPage != item.third) {
                              showScreen(item.third)
                          }
                      }

                      dock.addView(
                          button,
                          LinearLayout.LayoutParams(
                              0,
                              dp(48),
                              1f
                          )
                      )
                  }

                  val settings = text(
                      "⚙",
                      22f,
                      muted,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      isFocusable = true
                      setPadding(dp(20), 0, dp(20), 0)
                      setOnClickListener {
                          try {
                              startActivity(
                                  Intent(
                                      android.provider.Settings.ACTION_SETTINGS
                                  )
                              )
                          } catch (_: Exception) {
                          }
                      }
                  }

                  dock.addView(
                      settings,
                      LinearLayout.LayoutParams(dp(65), dp(48))
                  )

                  val params =
                      LinearLayout.LayoutParams(-1, dp(60))
                  params.topMargin = dp(8)

                  page.addView(dock, params)
              }

              private fun launchApp(app: AppEntry) {
                  try {
                      val intent =
                          packageManager.getLaunchIntentForPackage(
                              app.packageName
                          )

                      if (intent != null) {
                          startActivity(intent)
                      } else {
                          Toast.makeText(
                              this,
                              "Не удалось открыть приложение",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Ошибка запуска приложения",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              override fun onKeyDown(
                  keyCode: Int,
                  event: KeyEvent?
              ): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      when (currentPage) {
                          Screen.HDMI, Screen.LIBRARY -> {
                              showScreen(Screen.HOME)
                              return true
                          }

                          Screen.HOME -> return super.onKeyDown(
                              keyCode,
                              event
                          )
                      }
                  }

                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      showScreen(Screen.HDMI)
                      return true
                  }

                  if (keyCode == KeyEvent.KEYCODE_DPAD_DOWN) {
                      val focused = currentFocus

                      if (
                          currentPage == Screen.HOME &&
                          focused?.tag?.toString()?.startsWith("app_") == true ||
                          currentPage == Screen.HOME &&
                          focused?.tag == "first_app"
                      ) {
                          page.findViewWithTag<View>("dock_hdmi")
                              ?.requestFocus()
                          return true
                      }
                  }

                  if (keyCode == KeyEvent.KEYCODE_DPAD_UP) {
                      val focused = currentFocus

                      if (
                          focused?.tag == "dock_hdmi" ||
                          focused?.tag == "dock_home" ||
                          focused?.tag == "dock_library"
                      ) {
                          when (currentPage) {
                              Screen.HOME -> page
                                  .findViewWithTag<View>("first_app")
                                  ?.requestFocus()

                              Screen.HDMI -> page
                                  .findViewWithTag<View>("first_source")
                                  ?.requestFocus()

                              Screen.LIBRARY -> page
                                  .findViewWithTag<View>("first_library")
                                  ?.requestFocus()
                          }

                          return true
                      }
                  }

                  return super.onKeyDown(keyCode, event)
              }
          }
          EOF

      - name: Build APK
        run: |
          cd amethyst
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-TV-OS-v7
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
