name: Amethyst Launcher PS Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project
        shell: bash
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher

          cat > amethyst/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmethystPS"
          include(":app")
          EOF

          cat > amethyst/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > amethyst/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.amethyst.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.amethyst.launcher"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 5
                  versionName = "5.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Amethyst"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.text.TextUtils
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              private val white = Color.WHITE
              private val muted = Color.rgb(170, 181, 205)
              private val blue = Color.rgb(65, 125, 255)
              private val dark = Color.rgb(5, 8, 19)

              private lateinit var root: FrameLayout
              private lateinit var backdrop: View
              private lateinit var heroTitle: TextView
              private lateinit var heroSubtitle: TextView
              private lateinit var heroIcon: ImageView
              private lateinit var rail: LinearLayout
              private lateinit var railScroll: HorizontalScrollView
              private lateinit var sectionTitle: TextView
              private lateinit var libraryButton: TextView
              private lateinit var clock: TextView

              private val apps = mutableListOf<AppEntry>()
              private var selectedPackage = ""
              private var libraryMode = false
              private var mediaMode = false

              data class AppEntry(
                  val name: String,
                  val packageName: String,
                  val icon: android.graphics.drawable.Drawable
              )

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun gradient(
                  colors: IntArray,
                  radius: Int = 0
              ) = GradientDrawable(
                  GradientDrawable.Orientation.TL_BR,
                  colors
              ).apply {
                  cornerRadius = dp(radius).toFloat()
              }

              private fun text(
                  value: String,
                  size: Float,
                  color: Int = white,
                  bold: Boolean = false
              ) = TextView(this).apply {
                  text = value
                  textSize = size
                  setTextColor(color)
                  gravity = Gravity.CENTER_VERTICAL
                  if (bold) setTypeface(null, Typeface.BOLD)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = dark
                  window.navigationBarColor = dark
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  loadApps()
                  buildInterface()
              }

              private fun loadApps() {
                  apps.clear()
                  val found = linkedMapOf<String, ResolveInfo>()

                  listOf(
                      Intent.CATEGORY_LEANBACK_LAUNCHER,
                      Intent.CATEGORY_LAUNCHER
                  ).forEach { category ->
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(category)
                      packageManager.queryIntentActivities(intent, 0).forEach {
                          if (it.activityInfo.packageName != packageName) {
                              found[it.activityInfo.packageName] = it
                          }
                      }
                  }

                  found.values
                      .sortedBy { it.loadLabel(packageManager).toString().lowercase() }
                      .forEach {
                          apps.add(
                              AppEntry(
                                  it.loadLabel(packageManager).toString(),
                                  it.activityInfo.packageName,
                                  it.loadIcon(packageManager)
                              )
                          )
                      }
              }

              private fun buildInterface() {
                  root = FrameLayout(this)

                  backdrop = View(this).apply {
                      background = gradient(
                          intArrayOf(
                              Color.rgb(19, 43, 91),
                              Color.rgb(8, 17, 39),
                              dark
                          )
                      )
                  }
                  root.addView(backdrop, FrameLayout.LayoutParams(-1, -1))

                  val glow = View(this).apply {
                      background = gradient(
                          intArrayOf(
                              Color.argb(80, 48, 105, 255),
                              Color.argb(25, 25, 55, 120),
                              Color.TRANSPARENT
                          )
                      )
                  }
                  root.addView(glow, FrameLayout.LayoutParams(-1, -1))

                  val page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(58), dp(20), dp(58), dp(18))
                  }
                  root.addView(page, FrameLayout.LayoutParams(-1, -1))

                  buildTopBar(page)
                  buildHero(page)
                  buildSectionBar(page)
                  buildGameRail(page)
                  buildBottomBar(page)

                  setContentView(root)
                  refreshRail()

                  rail.post {
                      if (rail.childCount > 0) rail.getChildAt(0).requestFocus()
                  }
              }

              private fun buildTopBar(parent: LinearLayout) {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val brand = text("AMETHYST", 22f, white, true)
                  bar.addView(brand, LinearLayout.LayoutParams(0, dp(52), 1f))

                  val tabs = listOf("ИГРЫ", "МЕДИА")
                  tabs.forEachIndexed { index, name ->
                      val tab = text(name, 13f, muted, true).apply {
                          gravity = Gravity.CENTER
                          setPadding(dp(22), 0, dp(22), 0)
                          isFocusable = true
                          setOnFocusChangeListener { view, focused ->
                              (view as TextView).setTextColor(
                                  if (focused) white else muted
                              )
                          }
                          setOnClickListener {
                              mediaMode = index == 1
                              libraryMode = false
                              refreshRail()
                          }
                      }
                      bar.addView(tab, LinearLayout.LayoutParams(-2, dp(48)))
                  }

                  val profile = text("◉", 23f, white, true).apply {
                      gravity = Gravity.CENTER
                      isFocusable = true
                      setPadding(dp(20), 0, dp(20), 0)
                      setOnClickListener {
                          startActivity(Intent(android.provider.Settings.ACTION_SETTINGS))
                      }
                  }
                  bar.addView(profile, LinearLayout.LayoutParams(dp(58), dp(48)))

                  clock = text(
                      SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date()),
                      16f,
                      white,
                      true
                  ).apply { gravity = Gravity.CENTER }
                  bar.addView(clock, LinearLayout.LayoutParams(dp(65), dp(48)))

                  parent.addView(bar)
              }

              private fun buildHero(parent: LinearLayout) {
                  val hero = FrameLayout(this).apply {
                      background = gradient(
                          intArrayOf(
                              Color.rgb(38, 75, 151),
                              Color.rgb(20, 43, 91),
                              Color.rgb(10, 21, 47)
                          ),
                          24
                      )
                  }

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(34), dp(18), dp(20), dp(18))
                  }

                  content.addView(
                      text("ИГРАЙ. ОТКРЫВАЙ. ИССЛЕДУЙ.", 11f,
                          Color.rgb(181, 207, 255), true)
                  )

                  heroTitle = text("Добро пожаловать", 34f, white, true)
                  content.addView(
                      heroTitle,
                      LinearLayout.LayoutParams(-1, dp(58))
                  )

                  heroSubtitle = text(
                      "Твоя игровая библиотека начинается здесь",
                      15f,
                      muted
                  )
                  content.addView(heroSubtitle)

                  hero.addView(
                      content,
                      FrameLayout.LayoutParams(
                          dp(650),
                          -1,
                          Gravity.START or Gravity.CENTER_VERTICAL
                      )
                  )

                  heroIcon = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                  }

                  hero.addView(
                      heroIcon,
                      FrameLayout.LayoutParams(
                          dp(155),
                          dp(155),
                          Gravity.END or Gravity.CENTER_VERTICAL
                      ).apply {
                          marginEnd = dp(45)
                      }
                  )

                  val params = LinearLayout.LayoutParams(-1, dp(205))
                  params.topMargin = dp(22)
                  parent.addView(hero, params)
              }

              private fun buildSectionBar(parent: LinearLayout) {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  sectionTitle = text("ВАШИ ИГРЫ", 17f, white, true)
                  row.addView(
                      sectionTitle,
                      LinearLayout.LayoutParams(0, dp(52), 1f)
                  )

                  libraryButton = text("ПОЛНАЯ БИБЛИОТЕКА  →", 11f, muted, true).apply {
                      gravity = Gravity.CENTER
                      setPadding(dp(18), dp(10), dp(18), dp(10))
                      background = gradient(
                          intArrayOf(
                              Color.argb(45, 255, 255, 255),
                              Color.argb(25, 255, 255, 255)
                          ),
                          18
                      )
                      isFocusable = true
                      setOnFocusChangeListener { view, focused ->
                          view.background = gradient(
                              intArrayOf(
                                  if (focused) blue else Color.argb(45, 255, 255, 255),
                                  if (focused) Color.rgb(45, 95, 220)
                                  else Color.argb(25, 255, 255, 255)
                              ),
                              18
                          )
                      }
                      setOnClickListener {
                          libraryMode = !libraryMode
                          refreshRail()
                      }
                  }
                  row.addView(libraryButton)

                  val params = LinearLayout.LayoutParams(-1, dp(52))
                  params.topMargin = dp(12)
                  parent.addView(row, params)
              }

              private fun buildGameRail(parent: LinearLayout) {
                  railScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipToPadding = false
                      descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                      setPadding(dp(5), dp(12), dp(5), dp(15))
                  }

                  rail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  railScroll.addView(rail)

                  parent.addView(
                      railScroll,
                      LinearLayout.LayoutParams(-1, dp(205))
                  )
              }

              private fun buildBottomBar(parent: LinearLayout) {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = gradient(
                          intArrayOf(
                              Color.argb(175, 12, 22, 45),
                              Color.argb(145, 8, 15, 32)
                          ),
                          17
                      )
                      setPadding(dp(16), dp(5), dp(16), dp(5))
                  }

                  val actions = listOf(
                      "⚙  НАСТРОЙКИ",
                      "↻  ОБНОВИТЬ",
                      "⌂  ГЛАВНАЯ"
                  )

                  actions.forEachIndexed { index, value ->
                      val item = text(value, 11f, muted, true).apply {
                          gravity = Gravity.CENTER
                          isFocusable = true
                          setPadding(dp(12), dp(8), dp(12), dp(8))
                          setOnFocusChangeListener { view, focused ->
                              (view as TextView).setTextColor(
                                  if (focused) white else muted
                              )
                              view.background = if (focused) {
                                  gradient(intArrayOf(blue, Color.rgb(42, 86, 195)), 10)
                              } else null
                          }
                          setOnClickListener {
                              when (index) {
                                  0 -> startActivity(
                                      Intent(android.provider.Settings.ACTION_SETTINGS)
                                  )
                                  1 -> {
                                      loadApps()
                                      refreshRail()
                                  }
                                  2 -> {
                                      libraryMode = false
                                      mediaMode = false
                                      refreshRail()
                                  }
                              }
                          }
                      }
                      bar.addView(
                          item,
                          LinearLayout.LayoutParams(0, dp(43), 1f)
                      )
                  }

                  val params = LinearLayout.LayoutParams(-1, dp(54))
                  params.topMargin = dp(2)
                  parent.addView(bar, params)
              }

              private fun refreshRail() {
                  if (!::rail.isInitialized) return

                  rail.removeAllViews()

                  val visibleApps = if (libraryMode) apps else apps.take(12)

                  sectionTitle.text = when {
                      libraryMode -> "ВСЯ БИБЛИОТЕКА"
                      mediaMode -> "МЕДИА И ПРИЛОЖЕНИЯ"
                      else -> "ВАШИ ИГРЫ"
                  }

                  libraryButton.text = if (libraryMode) {
                      "НАЗАД  ←"
                  } else {
                      "ПОЛНАЯ БИБЛИОТЕКА  →"
                  }

                  if (visibleApps.isEmpty()) {
                      rail.addView(
                          text("Приложения не найдены", 16f, muted)
                      )
                      return
                  }

                  visibleApps.forEach { addAppTile(it) }

                  val selected = visibleApps.indexOfFirst {
                      it.packageName == selectedPackage
                  }

                  if (selected >= 0) {
                      rail.post {
                          rail.getChildAt(selected)?.requestFocus()
                      }
                  }
              }

              private fun addAppTile(app: AppEntry) {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      isFocusable = true
                      isClickable = true
                      setPadding(dp(7), dp(7), dp(7), dp(5))
                      background = gradient(
                          intArrayOf(
                              Color.argb(45, 255, 255, 255),
                              Color.argb(22, 255, 255, 255)
                          ),
                          13
                      )
                  }

                  val cover = FrameLayout(this).apply {
                      background = gradient(
                          intArrayOf(
                              Color.rgb(39, 57, 91),
                              Color.rgb(17, 28, 51)
                          ),
                          11
                      )
                      clipToOutline = true
                  }

                  val icon = ImageView(this).apply {
                      setImageDrawable(app.icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(dp(20), dp(20), dp(20), dp(20))
                  }

                  cover.addView(icon, FrameLayout.LayoutParams(-1, -1))
                  tile.addView(
                      cover,
                      LinearLayout.LayoutParams(-1, dp(112))
                  )

                  val name = text(app.name, 12f, white, true).apply {
                      gravity = Gravity.CENTER
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                  }

                  val nameParams = LinearLayout.LayoutParams(-1, dp(45))
                  nameParams.topMargin = dp(5)
                  tile.addView(name, nameParams)

                  tile.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.08f else 1f)
                          .scaleY(if (focused) 1.08f else 1f)
                          .setDuration(170)
                          .start()

                      view.background = gradient(
                          intArrayOf(
                              if (focused) Color.argb(125, 65, 125, 255)
                              else Color.argb(45, 255, 255, 255),
                              if (focused) Color.argb(75, 45, 95, 220)
                              else Color.argb(22, 255, 255, 255)
                          ),
                          13
                      )

                      if (focused) {
                          selectedPackage = app.packageName
                          heroTitle.text = app.name
                          heroSubtitle.text = app.packageName
                          heroIcon.setImageDrawable(app.icon)

                          backdrop.background = gradient(
                              intArrayOf(
                                  Color.rgb(24, 52, 111),
                                  Color.rgb(8, 18, 43),
                                  dark
                              )
                          )

                          railScroll.smoothScrollTo(
                              view.left - dp(30),
                              0
                          )
                      }
                  }

                  tile.setOnClickListener {
                      launchApp(app)
                  }

                  val params = LinearLayout.LayoutParams(dp(170), dp(174))
                  params.marginEnd = dp(17)
                  rail.addView(tile, params)
              }

              private fun launchApp(app: AppEntry) {
                  try {
                      val intent = packageManager.getLaunchIntentForPackage(
                          app.packageName
                      )
                      if (intent != null) startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              override fun onKeyDown(
                  keyCode: Int,
                  event: KeyEvent?
              ): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK && libraryMode) {
                      libraryMode = false
                      refreshRail()
                      return true
                  }

                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      startActivity(
                          Intent(android.provider.Settings.ACTION_SETTINGS)
                      )
                      return true
                  }

                  return super.onKeyDown(keyCode, event)
              }
          }
          EOF

      - name: Build APK
        run: |
          cd amethyst
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-PS-Edition-v5
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
