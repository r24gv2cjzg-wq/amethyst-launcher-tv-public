name: Amethyst Launcher PS Edition 4.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher

          cat > amethyst/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmethystPS"
          include(":app")
          EOF

          cat > amethyst/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > amethyst/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.amethyst.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.amethyst.launcher"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 4
                  versionName = "4.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Amethyst PS Edition"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.text.TextUtils

          class MainActivity : Activity() {

              private val white = Color.WHITE
              private val muted = Color.rgb(190, 198, 216)
              private val blue = Color.rgb(65, 125, 255)
              private val dark = Color.rgb(5, 9, 23)

              private lateinit var root: FrameLayout
              private lateinit var background: View
              private lateinit var header: LinearLayout
              private lateinit var categoryText: TextView
              private lateinit var title: TextView
              private lateinit var subtitle: TextView
              private lateinit var selectedIcon: ImageView
              private lateinit var rail: LinearLayout
              private lateinit var railScroll: HorizontalScrollView
              private lateinit var footer: LinearLayout

              private val apps = mutableListOf<AppEntry>()
              private var selectedPackage = ""
              private var mediaMode = false
              private var libraryMode = false

              data class AppEntry(
                  val name: String,
                  val packageName: String,
                  val activityName: String,
                  val icon: android.graphics.drawable.Drawable
              )

              private fun dp(v: Int): Int =
                  (v * resources.displayMetrics.density).toInt()

              private fun shape(
                  color: Int,
                  radius: Int,
                  stroke: Int = Color.TRANSPARENT
              ) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(radius).toFloat()
                  if (stroke != Color.TRANSPARENT) {
                      setStroke(dp(2), stroke)
                  }
              }

              private fun label(
                  value: String,
                  size: Float,
                  color: Int,
                  bold: Boolean = false
              ) = TextView(this).apply {
                  text = value
                  textSize = size
                  setTextColor(color)
                  gravity = Gravity.CENTER_VERTICAL
                  if (bold) setTypeface(null, Typeface.BOLD)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = dark
                  window.navigationBarColor = dark
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  loadApps()
                  createScreen()
              }

              private fun loadApps() {
                  apps.clear()
                  val pm = packageManager
                  val found = linkedMapOf<String, ResolveInfo>()

                  val categories = listOf(
                      Intent.CATEGORY_LEANBACK_LAUNCHER,
                      Intent.CATEGORY_LAUNCHER
                  )

                  categories.forEach { category ->
                      val query = Intent(Intent.ACTION_MAIN).addCategory(category)
                      pm.queryIntentActivities(query, 0).forEach { info ->
                          val pkg = info.activityInfo.packageName
                          if (pkg != packageName) found[pkg] = info
                      }
                  }

                  found.values.sortedBy {
                      it.loadLabel(pm).toString().lowercase()
                  }.forEach { info ->
                      apps.add(
                          AppEntry(
                              info.loadLabel(pm).toString(),
                              info.activityInfo.packageName,
                              info.activityInfo.name,
                              info.loadIcon(pm)
                          )
                      )
                  }
              }

              private fun createScreen() {
                  root = FrameLayout(this)

                  background = View(this).apply {
                      setBackgroundColor(dark)
                  }

                  root.addView(
                      background,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val gradient = View(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(
                              Color.rgb(21, 47, 103),
                              Color.rgb(8, 18, 45),
                              dark
                          )
                      )
                  }

                  root.addView(
                      gradient,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(58), dp(22), dp(58), dp(22))
                  }

                  root.addView(
                      content,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  buildHeader(content)
                  buildHero(content)
                  buildNavigation(content)
                  buildRail(content)
                  buildFooter(content)

                  setContentView(root)
                  showApps()

                  rail.post {
                      if (rail.childCount > 0) {
                          rail.getChildAt(0).requestFocus()
                      }
                  }
              }

              private fun buildHeader(parent: LinearLayout) {
                  header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val logo = label("AMETHYST", 23f, white, true)
                  header.addView(
                      logo,
                      LinearLayout.LayoutParams(0, dp(48), 1f)
                  )

                  val games = label("GAMES", 13f, white, true)
                  val media = label("MEDIA", 13f, muted, true)

                  listOf(games, media).forEachIndexed { index, item ->
                      item.gravity = Gravity.CENTER
                      item.setPadding(dp(20), 0, dp(20), 0)
                      item.isFocusable = true
                      item.setOnFocusChangeListener { v, focused ->
                          (v as TextView).setTextColor(
                              if (focused) white else muted
                          )
                      }
                      item.setOnClickListener {
                          mediaMode = index == 1
                          libraryMode = false
                          showApps()
                      }
                      header.addView(
                          item,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              dp(48)
                          )
                      )
                  }

                  val time = label(
                      java.text.SimpleDateFormat(
                          "HH:mm",
                          java.util.Locale.getDefault()
                      ).format(java.util.Date()),
                      17f,
                      white,
                      true
                  )
                  time.gravity = Gravity.CENTER
                  header.addView(
                      time,
                      LinearLayout.LayoutParams(dp(75), dp(48))
                  )

                  parent.addView(header)
              }

              private fun buildHero(parent: LinearLayout) {
                  val hero = FrameLayout(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(
                              Color.rgb(34, 65, 135),
                              Color.rgb(16, 32, 73),
                              Color.argb(30, 10, 20, 45)
                          )
                      ).apply {
                          cornerRadius = dp(25).toFloat()
                      }
                  }

                  val details = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(34), dp(20), dp(20), dp(20))
                  }

                  categoryText = label(
                      "PLAY YOUR WAY",
                      12f,
                      Color.rgb(170, 198, 255),
                      true
                  )

                  title = label(
                      "Добро пожаловать",
                      34f,
                      white,
                      true
                  )

                  subtitle = label(
                      "Выбери приложение",
                      16f,
                      muted
                  )

                  details.addView(categoryText)
                  details.addView(
                      title,
                      LinearLayout.LayoutParams(-1, dp(58))
                  )
                  details.addView(subtitle)

                  hero.addView(
                      details,
                      FrameLayout.LayoutParams(
                          0,
                          -1,
                          Gravity.START
                      ).apply {
                          width = dp(650)
                      }
                  )

                  selectedIcon = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                  }

                  hero.addView(
                      selectedIcon,
                      FrameLayout.LayoutParams(
                          dp(150),
                          dp(150),
                          Gravity.END or Gravity.CENTER_VERTICAL
                      ).apply {
                          marginEnd = dp(48)
                      }
                  )

                  val params = LinearLayout.LayoutParams(-1, dp(205))
                  params.topMargin = dp(25)
                  parent.addView(hero, params)
              }

              private fun buildNavigation(parent: LinearLayout) {
                  val nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val heading = label(
                      "ИГРЫ И ПРИЛОЖЕНИЯ",
                      17f,
                      white,
                      true
                  )

                  nav.addView(
                      heading,
                      LinearLayout.LayoutParams(0, dp(48), 1f)
                  )

                  val library = label(
                      "БИБЛИОТЕКА  →",
                      12f,
                      muted,
                      true
                  ).apply {
                      isFocusable = true
                      setPadding(dp(16), dp(9), dp(16), dp(9))
                      background = shape(
                          Color.argb(35, 255, 255, 255),
                          18
                      )
                      setOnClickListener {
                          libraryMode = !libraryMode
                          showApps()
                      }
                  }

                  nav.addView(library)

                  val params = LinearLayout.LayoutParams(-1, dp(48))
                  params.topMargin = dp(13)
                  parent.addView(nav, params)
              }

              private fun buildRail(parent: LinearLayout) {
                  railScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipToPadding = false
                      descendantFocusability =
                          ViewGroup.FOCUS_AFTER_DESCENDANTS
                      setPadding(dp(5), dp(12), dp(5), dp(15))
                  }

                  rail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  railScroll.addView(rail)

                  val params = LinearLayout.LayoutParams(-1, dp(205))
                  parent.addView(railScroll, params)
              }

              private fun buildFooter(parent: LinearLayout) {
                  footer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = shape(
                          Color.argb(155, 12, 22, 49),
                          18
                      )
                      setPadding(dp(18), dp(8), dp(18), dp(8))
                  }

                  val actions = listOf(
                      "⚙  Настройки",
                      "↻  Обновить",
                      "⌂  Главная"
                  )

                  actions.forEachIndexed { index, name ->
                      val item = label(name, 12f, muted, true).apply {
                          gravity = Gravity.CENTER
                          isFocusable = true
                          setPadding(dp(14), dp(7), dp(14), dp(7))
                          setOnFocusChangeListener { v, focused ->
                              v.background = shape(
                                  if (focused) blue else Color.TRANSPARENT,
                                  12
                              )
                              (v as TextView).setTextColor(
                                  if (focused) white else muted
                              )
                          }
                          setOnClickListener {
                              when (index) {
                                  0 -> startActivity(
                                      Intent(android.provider.Settings.ACTION_SETTINGS)
                                  )
                                  1 -> {
                                      loadApps()
                                      showApps()
                                  }
                                  2 -> {
                                      libraryMode = false
                                      showApps()
                                  }
                              }
                          }
                      }

                      footer.addView(
                          item,
                          LinearLayout.LayoutParams(0, dp(42), 1f)
                      )
                  }

                  val params = LinearLayout.LayoutParams(-1, dp(58))
                  params.topMargin = dp(3)
                  parent.addView(footer, params)
              }

              private fun showApps() {
                  if (!::rail.isInitialized) return

                  rail.removeAllViews()

                  val list = if (libraryMode) apps else apps.take(10)

                  categoryText.text = if (libraryMode) {
                      "YOUR COLLECTION"
                  } else {
                      "PLAY YOUR WAY"
                  }

                  if (list.isEmpty()) {
                      rail.addView(
                          label("Приложения не найдены", 16f, muted)
                      )
                      return
                  }

                  list.forEach { app -> addTile(app) }

                  val index = list.indexOfFirst {
                      it.packageName == selectedPackage
                  }

                  if (index >= 0) {
                      rail.post {
                          rail.getChildAt(index)?.requestFocus()
                      }
                  }
              }

              private fun addTile(app: AppEntry) {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      isFocusable = true
                      isClickable = true
                      setPadding(dp(8), dp(8), dp(8), dp(5))
                      background = shape(
                          Color.argb(65, 255, 255, 255),
                          12
                      )
                  }

                  val cover = FrameLayout(this).apply {
                      background = shape(
                          Color.rgb(27, 40, 69),
                          12
                      )
                      clipToOutline = true
                  }

                  val image = ImageView(this).apply {
                      setImageDrawable(app.icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(dp(22), dp(22), dp(22), dp(22))
                  }

                  cover.addView(
                      image,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  tile.addView(
                      cover,
                      LinearLayout.LayoutParams(-1, dp(112))
                  )

                  val name = label(app.name, 12f, white, true).apply {
                      gravity = Gravity.CENTER
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                      includeFontPadding = true
                  }

                  val nameParams = LinearLayout.LayoutParams(-1, dp(48))
                  nameParams.topMargin = dp(5)
                  tile.addView(name, nameParams)

                  tile.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.07f else 1f)
                          .scaleY(if (focused) 1.07f else 1f)
                          .setDuration(180)
                          .start()

                      view.background = shape(
                          if (focused) Color.argb(100, 65, 125, 255)
                          else Color.argb(65, 255, 255, 255),
                          12,
                          if (focused) Color.rgb(150, 190, 255)
                          else Color.TRANSPARENT
                      )

                      if (focused) {
                          selectedPackage = app.packageName
                          title.text = app.name
                          subtitle.text = app.packageName
                          selectedIcon.setImageDrawable(app.icon)
                          railScroll.smoothScrollTo(
                              view.left - dp(25),
                              0
                          )
                      }
                  }

                  tile.setOnClickListener { launch(app) }

                  val params = LinearLayout.LayoutParams(dp(170), dp(178))
                  params.marginEnd = dp(18)
                  rail.addView(tile, params)
              }

              private fun launch(app: AppEntry) {
                  try {
                      val intent =
                          packageManager.getLaunchIntentForPackage(
                              app.packageName
                          )
                      if (intent != null) startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              override fun onKeyDown(
                  keyCode: Int,
                  event: KeyEvent?
              ): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK && libraryMode) {
                      libraryMode = false
                      showApps()
                      return true
                  }

                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      startActivity(
                          Intent(android.provider.Settings.ACTION_SETTINGS)
                      )
                      return true
                  }

                  return super.onKeyDown(keyCode, event)
              }
          }
          EOF

      - name: Build APK
        run: |
          cd amethyst
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-PS-Edition-v4
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
