name: Amethyst Launcher PS Edition 6.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project
        shell: bash
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher

          cat > amethyst/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmethystPS"
          include(":app")
          EOF

          cat > amethyst/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > amethyst/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.amethyst.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.amethyst.launcher"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 6
                  versionName = "6.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Amethyst"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.text.TextUtils
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var root: FrameLayout
              private lateinit var background: View
              private lateinit var rail: LinearLayout
              private lateinit var railScroll: HorizontalScrollView
              private lateinit var title: TextView
              private lateinit var subtitle: TextView
              private lateinit var heroIcon: ImageView
              private lateinit var clock: TextView
              private lateinit var count: TextView

              private val apps = mutableListOf<AppEntry>()

              private var selected = 0
              private var libraryMode = false
              private var mediaMode = false

              private val blue = Color.rgb(65, 125, 255)
              private val white = Color.WHITE
              private val muted = Color.rgb(177, 190, 215)
              private val dark = Color.rgb(5, 8, 19)

              data class AppEntry(
                  val name: String,
                  val packageName: String,
                  val icon: android.graphics.drawable.Drawable
              )

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun bg(
                  colors: IntArray,
                  radius: Int = 0
              ) = GradientDrawable(
                  GradientDrawable.Orientation.TL_BR,
                  colors
              ).apply {
                  cornerRadius = dp(radius).toFloat()
              }

              private fun label(
                  value: String,
                  size: Float,
                  color: Int = white,
                  bold: Boolean = false
              ) = TextView(this).apply {
                  text = value
                  textSize = size
                  setTextColor(color)
                  gravity = Gravity.CENTER_VERTICAL
                  if (bold) setTypeface(null, Typeface.BOLD)
              }

              private fun palette(index: Int): IntArray {
                  val palettes = arrayOf(
                      intArrayOf(
                          Color.rgb(17, 65, 135),
                          Color.rgb(8, 22, 57),
                          dark
                      ),
                      intArrayOf(
                          Color.rgb(75, 35, 112),
                          Color.rgb(24, 15, 52),
                          dark
                      ),
                      intArrayOf(
                          Color.rgb(15, 91, 91),
                          Color.rgb(8, 35, 49),
                          dark
                      ),
                      intArrayOf(
                          Color.rgb(120, 55, 35),
                          Color.rgb(48, 22, 28),
                          dark
                      ),
                      intArrayOf(
                          Color.rgb(45, 58, 120),
                          Color.rgb(17, 23, 55),
                          dark
                      )
                  )
                  return palettes[index.mod(palettes.size)]
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = dark
                  window.navigationBarColor = dark
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  loadApps()
                  createScreen()
              }

              private fun loadApps() {
                  apps.clear()

                  val found = linkedMapOf<String, ResolveInfo>()

                  listOf(
                      Intent.CATEGORY_LEANBACK_LAUNCHER,
                      Intent.CATEGORY_LAUNCHER
                  ).forEach { category ->
                      val intent = Intent(Intent.ACTION_MAIN)
                          .addCategory(category)

                      packageManager.queryIntentActivities(intent, 0)
                          .forEach {
                              val pkg = it.activityInfo.packageName
                              if (pkg != packageName) found[pkg] = it
                          }
                  }

                  found.values
                      .sortedBy {
                          it.loadLabel(packageManager)
                              .toString().lowercase()
                      }
                      .forEach {
                          apps.add(
                              AppEntry(
                                  it.loadLabel(packageManager).toString(),
                                  it.activityInfo.packageName,
                                  it.loadIcon(packageManager)
                              )
                          )
                      }
              }

              private fun createScreen() {
                  root = FrameLayout(this)

                  background = View(this).apply {
                      background = bg(palette(0))
                  }

                  root.addView(
                      background,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val shade = View(this).apply {
                      background = bg(
                          intArrayOf(
                              Color.argb(20, 0, 0, 0),
                              Color.argb(100, 0, 0, 0),
                              Color.argb(225, 0, 0, 0)
                          )
                      )
                  }

                  root.addView(
                      shade,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(64), dp(20),
                          dp(64), dp(18)
                      )
                  }

                  root.addView(
                      page,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  createTopBar(page)
                  createGameRail(page)
                  createHero(page)
                  createFooter(page)

                  setContentView(root)
                  refresh()
              }

              private fun createTopBar(parent: LinearLayout) {
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val brand = label(
                      "AMETHYST",
                      22f,
                      white,
                      true
                  )

                  bar.addView(
                      brand,
                      LinearLayout.LayoutParams(0, dp(58), 1f)
                  )

                  val games = makeTab("ИГРЫ") {
                      mediaMode = false
                      libraryMode = false
                      refresh()
                  }

                  val media = makeTab("МЕДИА") {
                      mediaMode = true
                      libraryMode = false
                      refresh()
                  }

                  bar.addView(games)
                  bar.addView(media)

                  val profile = label("◉", 24f, white, true).apply {
                      gravity = Gravity.CENTER
                      isFocusable = true
                      setPadding(dp(22), 0, dp(22), 0)
                      setOnClickListener {
                          startActivity(
                              Intent(android.provider.Settings.ACTION_SETTINGS)
                          )
                      }
                  }

                  bar.addView(
                      profile,
                      LinearLayout.LayoutParams(dp(58), dp(52))
                  )

                  clock = label("00:00", 16f, white, true).apply {
                      gravity = Gravity.CENTER
                  }

                  bar.addView(
                      clock,
                      LinearLayout.LayoutParams(dp(70), dp(52))
                  )

                  parent.addView(bar)
              }

              private fun makeTab(
                  name: String,
                  action: () -> Unit
              ): TextView {
                  return label(name, 13f, muted, true).apply {
                      gravity = Gravity.CENTER
                      isFocusable = true
                      setPadding(dp(22), 0, dp(22), 0)

                      setOnFocusChangeListener { view, focused ->
                          (view as TextView).setTextColor(
                              if (focused) white else muted
                          )
                      }

                      setOnClickListener { action() }
                  }
              }

              private fun createGameRail(parent: LinearLayout) {
                  val heading = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val section = label(
                      "ИГРЫ",
                      13f,
                      Color.rgb(190, 205, 235),
                      true
                  )

                  heading.addView(
                      section,
                      LinearLayout.LayoutParams(0, dp(38), 1f)
                  )

                  count = label("", 12f, muted)
                  heading.addView(count)

                  val headingParams =
                      LinearLayout.LayoutParams(-1, dp(38))
                  headingParams.topMargin = dp(14)
                  parent.addView(heading, headingParams)

                  railScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipToPadding = false
                      descendantFocusability =
                          ViewGroup.FOCUS_AFTER_DESCENDANTS
                      setPadding(dp(8), dp(15), dp(30), dp(18))
                  }

                  rail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  railScroll.addView(rail)

                  parent.addView(
                      railScroll,
                      LinearLayout.LayoutParams(-1, dp(245))
                  )
              }

              private fun createHero(parent: LinearLayout) {
                  val hero = FrameLayout(this).apply {
                      clipChildren = false
                      clipToPadding = false
                  }

                  val info = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(5), dp(10), dp(5))
                  }

                  val eyebrow = label(
                      "ИГРОВАЯ БИБЛИОТЕКА",
                      11f,
                      Color.rgb(170, 198, 255),
                      true
                  )

                  info.addView(eyebrow)

                  title = label(
                      "Добро пожаловать",
                      36f,
                      white,
                      true
                  ).apply {
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }

                  val titleParams =
                      LinearLayout.LayoutParams(-1, dp(60))
                  titleParams.topMargin = dp(8)
                  info.addView(title, titleParams)

                  subtitle = label(
                      "Выберите приложение, чтобы начать",
                      15f,
                      muted
                  ).apply {
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }

                  info.addView(subtitle)

                  val hint = label(
                      "✕  ЗАПУСТИТЬ",
                      12f,
                      white,
                      true
                  ).apply {
                      background = bg(
                          intArrayOf(
                              Color.rgb(55, 111, 238),
                              Color.rgb(39, 80, 190)
                          ),
                          22
                      )
                      gravity = Gravity.CENTER
                      setPadding(
                          dp(22), dp(12),
                          dp(22), dp(12)
                      )
                  }

                  val hintParams =
                      LinearLayout.LayoutParams(-2, dp(43))
                  hintParams.topMargin = dp(20)
                  info.addView(hint, hintParams)

                  hero.addView(
                      info,
                      FrameLayout.LayoutParams(
                          dp(690),
                          -1,
                          Gravity.START or Gravity.CENTER_VERTICAL
                      )
                  )

                  heroIcon = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      alpha = 0.88f
                  }

                  hero.addView(
                      heroIcon,
                      FrameLayout.LayoutParams(
                          dp(230),
                          dp(230),
                          Gravity.END or Gravity.CENTER_VERTICAL
                      )
                  )

                  val params =
                      LinearLayout.LayoutParams(-1, 0, 1f)
                  params.topMargin = dp(8)
                  parent.addView(hero, params)
              }

              private fun createFooter(parent: LinearLayout) {
                  val footer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val actions = listOf(
                      "○  ВЫБРАТЬ",
                      "△  НАСТРОЙКИ",
                      "□  БИБЛИОТЕКА"
                  )

                  actions.forEachIndexed { index, value ->
                      val item = label(
                          value,
                          11f,
                          muted,
                          true
                      ).apply {
                          gravity = Gravity.CENTER
                          isFocusable = true
                          setPadding(
                              dp(15), dp(8),
                              dp(15), dp(8)
                          )

                          setOnFocusChangeListener { view, focused ->
                              (view as TextView).setTextColor(
                                  if (focused) white else muted
                              )
                          }

                          setOnClickListener {
                              when (index) {
                                  0 -> {
                                      if (apps.isNotEmpty()) {
                                          launch(apps[selected])
                                      }
                                  }
                                  1 -> startActivity(
                                      Intent(
                                          android.provider.Settings.ACTION_SETTINGS
                                      )
                                  )
                                  2 -> {
                                      libraryMode = !libraryMode
                                      refresh()
                                  }
                              }
                          }
                      }

                      footer.addView(item)
                  }

                  val params =
                      LinearLayout.LayoutParams(-1, dp(45))
                  params.topMargin = dp(4)
                  parent.addView(footer, params)
              }

              private fun refresh() {
                  if (!::rail.isInitialized) return

                  rail.removeAllViews()

                  val visible = if (libraryMode) {
                      apps
                  } else {
                      apps.take(12)
                  }

                  count.text = "${apps.size} ПРИЛОЖЕНИЙ"

                  if (visible.isEmpty()) {
                      title.text = "Приложения не найдены"
                      subtitle.text = "Установленные приложения появятся здесь"
                      return
                  }

                  if (selected >= visible.size) selected = 0

                  visible.forEachIndexed { index, app ->
                      createTile(app, index)
                  }

                  rail.post {
                      rail.getChildAt(selected)?.requestFocus()
                  }

                  updateHero(visible[selected])
              }

              private fun createTile(
                  app: AppEntry,
                  index: Int
              ) {
                  val tile = FrameLayout(this).apply {
                      isFocusable = true
                      isClickable = true
                      clipChildren = false
                      clipToPadding = false
                  }

                  val cover = FrameLayout(this).apply {
                      background = bg(
                          intArrayOf(
                              Color.rgb(35, 52, 83),
                              Color.rgb(12, 20, 38)
                          ),
                          12
                      )
                      clipToOutline = true
                  }

                  val icon = ImageView(this).apply {
                      setImageDrawable(app.icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(
                          dp(22), dp(22),
                          dp(22), dp(22)
                      )
                  }

                  cover.addView(
                      icon,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  tile.addView(
                      cover,
                      FrameLayout.LayoutParams(-1, dp(143))
                  )

                  val name = label(
                      app.name,
                      12f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                  }

                  val nameParams = FrameLayout.LayoutParams(
                      -1,
                      dp(42),
                      Gravity.BOTTOM
                  )

                  tile.addView(name, nameParams)

                  tile.setOnFocusChangeListener { view, focused ->
                      view.animate()
                          .scaleX(if (focused) 1.12f else 1f)
                          .scaleY(if (focused) 1.12f else 1f)
                          .setDuration(180)
                          .start()

                      cover.background = bg(
                          if (focused) {
                              intArrayOf(
                                  Color.rgb(65, 125, 255),
                                  Color.rgb(35, 75, 170)
                              )
                          } else {
                              intArrayOf(
                                  Color.rgb(35, 52, 83),
                                  Color.rgb(12, 20, 38)
                              )
                          },
                          12
                      )

                      if (focused) {
                          selected = index
                          updateHero(app)
                          railScroll.smoothScrollTo(
                              maxOf(0, view.left - dp(30)),
                              0
                          )
                      }
                  }

                  tile.setOnClickListener {
                      launch(app)
                  }

                  val params = LinearLayout.LayoutParams(
                      dp(165),
                      dp(190)
                  )
                  params.marginEnd = dp(20)
                  rail.addView(tile, params)
              }

              private fun updateHero(app: AppEntry) {
                  title.text = app.name
                  subtitle.text = app.packageName
                  heroIcon.setImageDrawable(app.icon)

                  val index = apps.indexOf(app).coerceAtLeast(0)

                  background.background = bg(
                      palette(index)
                  )
              }

              private fun launch(app: AppEntry) {
                  try {
                      val intent =
                          packageManager.getLaunchIntentForPackage(
                              app.packageName
                          )

                      if (intent != null) startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              override fun onKeyDown(
                  keyCode: Int,
                  event: KeyEvent?
              ): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (libraryMode) {
                          libraryMode = false
                          refresh()
                          return true
                      }
                  }

                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      startActivity(
                          Intent(
                              android.provider.Settings.ACTION_SETTINGS
                          )
                      )
                      return true
                  }

                  return super.onKeyDown(keyCode, event)
              }
          }
          EOF

      - name: Build APK
        run: |
          cd amethyst
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-PS-Edition-v6
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
