name: Build Amethyst Launcher TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate project
        shell: bash
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher
          mkdir -p amethyst/app/src/main/res/values

          cat > amethyst/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AmethystLauncher"
          include(":app")
          EOF

          cat > amethyst/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          cat > amethyst/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.amethyst.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.amethyst.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 11
                  versionName '10.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > amethyst/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AmethystTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#B9A5FF</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowBackground">#090B14</item>
                  <item name="android:navigationBarColor">#090B14</item>
                  <item name="android:statusBarColor">#090B14</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="Аметист"
                  android:theme="@style/AmethystTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.tv.TvContract
          import android.media.tv.TvInputInfo
          import android.media.tv.TvInputManager
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale
          import java.util.TimeZone
          import java.text.SimpleDateFormat

          class MainActivity : Activity() {

              private val backgroundColor = Color.rgb(8, 10, 19)
              private val white = Color.rgb(245, 246, 255)
              private val muted = Color.rgb(157, 164, 187)
              private val accent = Color.rgb(181, 157, 255)
              private val accentDark = Color.rgb(105, 81, 180)
              private val cardColor = Color.rgb(25, 29, 48)

              private lateinit var root: FrameLayout
              private lateinit var homePage: LinearLayout
              private lateinit var inputsPage: LinearLayout
              private lateinit var libraryPage: LinearLayout

              private lateinit var heroIcon: ImageView
              private lateinit var heroTitle: TextView
              private lateinit var heroSubtitle: TextView

              private lateinit var appRail: LinearLayout
              private lateinit var inputRail: LinearLayout
              private lateinit var libraryContent: LinearLayout

              private lateinit var appScroll: HorizontalScrollView
              private lateinit var inputScroll: HorizontalScrollView
              private lateinit var libraryScroll: ScrollView

              private var currentPage = "home"
              private var selectedApp = 0
              private var lastHomeFocus: View? = null
              private var firstAppTile: View? = null
              private var firstInputTile: View? = null

              private data class AppEntry(
                  val label: String,
                  val packageName: String,
                  val icon: android.graphics.drawable.Drawable,
                  val launchIntent: Intent
              )

              private data class InputEntry(
                  val label: String,
                  val inputId: String,
                  val isPlayStation: Boolean
              )

              private val apps = mutableListOf<AppEntry>()
              private val inputs = mutableListOf<InputEntry>()

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun shape(
                  color: Int,
                  radius: Int,
                  borderColor: Int = Color.TRANSPARENT,
                  borderWidth: Int = 0
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                      if (borderWidth > 0) {
                          setStroke(dp(borderWidth), borderColor)
                      }
                  }
              }

              private fun gradient(
                  colors: IntArray,
                  radius: Int
              ): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      colors
                  ).apply {
                      cornerRadius = dp(radius).toFloat()
                  }
              }

              private fun label(
                  value: String,
                  size: Float,
                  color: Int = white,
                  bold: Boolean = false
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      typeface = if (bold) {
                          Typeface.create("sans-serif", Typeface.BOLD)
                      } else {
                          Typeface.create("sans-serif", Typeface.NORMAL)
                      }
                      gravity = Gravity.CENTER_VERTICAL
                  }
              }

              private fun loadApps() {
                  apps.clear()

                  val pm = packageManager
                  val leanback = Intent(Intent.ACTION_MAIN)
                      .addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)

                  val results = pm.queryIntentActivities(leanback, 0)

                  val discovered = results.mapNotNull { info ->
                      val packageName = info.activityInfo?.packageName
                          ?: return@mapNotNull null

                      if (packageName == this.packageName ||
                          packageName == "com.mitv.tvhome.atv"
                      ) {
                          return@mapNotNull null
                      }

                      val launch = pm.getLaunchIntentForPackage(packageName)
                          ?: return@mapNotNull null

                      AppEntry(
                          info.loadLabel(pm)?.toString() ?: packageName,
                          packageName,
                          info.loadIcon(pm),
                          launch
                      )
                  }.distinctBy { it.packageName }
                      .sortedBy { it.label.lowercase(Locale.getDefault()) }

                  apps.addAll(discovered)

                  if (apps.isEmpty()) {
                      val fallback = pm.queryIntentActivities(
                          Intent(Intent.ACTION_MAIN)
                              .addCategory(Intent.CATEGORY_LAUNCHER),
                          0
                      )

                      fallback.mapNotNull { info ->
                          val packageName = info.activityInfo?.packageName
                              ?: return@mapNotNull null

                          if (packageName == this.packageName ||
                              packageName == "com.mitv.tvhome.atv"
                          ) {
                              return@mapNotNull null
                          }

                          val launch = pm.getLaunchIntentForPackage(packageName)
                              ?: return@mapNotNull null

                          AppEntry(
                              info.loadLabel(pm)?.toString() ?: packageName,
                              packageName,
                              info.loadIcon(pm),
                              launch
                          )
                      }.distinctBy { it.packageName }
                          .sortedBy { it.label.lowercase(Locale.getDefault()) }
                          .forEach { apps.add(it) }
                  }
              }

              private fun loadInputs() {
                  inputs.clear()

                  try {
                      val manager = getSystemService(Context.TV_INPUT_SERVICE)
                          as TvInputManager

                      val all = manager.tvInputList.filter {
                          it.type == TvInputInfo.TYPE_HDMI
                      }

                      val hasPs5 = all.any {
                          it.id.contains("HDMI300004", true) ||
                          it.loadLabel(this).toString()
                              .contains("PlayStation", true)
                      }

                      all.forEach { info ->
                          val id = info.id

                          // CEC entry is a logical device, not another HDMI port.
                          if (id.contains("HDMI300004", true)) {
                              return@forEach
                          }

                          val isPortThree = id.contains("HW4", true)
                          val ps5 = hasPs5 && isPortThree

                          val name = when {
                              ps5 -> "PlayStation 5"
                              id.contains("HW2", true) -> "HDMI 1"
                              id.contains("HW3", true) -> "HDMI 2"
                              id.contains("HW4", true) -> "HDMI 3"
                              else -> info.loadLabel(this).toString()
                          }

                          inputs.add(
                              InputEntry(name, id, ps5)
                          )
                      }

                      inputs.sortBy {
                          when {
                              it.inputId.contains("HW2", true) -> 1
                              it.inputId.contains("HW3", true) -> 2
                              it.inputId.contains("HW4", true) -> 3
                              else -> 9
                          }
                      }

                  } catch (_: Exception) {
                      // Input discovery may be restricted by TV firmware.
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION

                  loadApps()
                  loadInputs()
                  createUI()
              }

              private fun createUI() {
                  root = FrameLayout(this).apply {
                      setBackgroundColor(backgroundColor)
                      isFocusable = true
                      isFocusableInTouchMode = true
                  }

                  homePage = createPage()
                  inputsPage = createPage()
                  libraryPage = createPage()

                  root.addView(homePage, matchParams())
                  root.addView(inputsPage, matchParams())
                  root.addView(libraryPage, matchParams())

                  inputsPage.visibility = View.GONE
                  libraryPage.visibility = View.GONE

                  buildHome()
                  buildInputs()
                  buildLibrary()

                  setContentView(root)

                  root.post {
                      firstAppTile?.requestFocus()
                          ?: root.requestFocus()
                  }
              }

              private fun createPage(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(54), dp(24), dp(54), dp(22))
                      background = gradient(
                          intArrayOf(
                              Color.rgb(24, 27, 55),
                              Color.rgb(14, 17, 34),
                              Color.rgb(8, 10, 19)
                          ),
                          0
                      )
                      clipChildren = false
                      clipToPadding = false
                  }
              }

              private fun matchParams() = FrameLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.MATCH_PARENT
              )

              private fun makeHeader(active: String): LinearLayout {
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val logo = label("АМЕТИСТ", 18f, white, true).apply {
                      letterSpacing = 0.13f
                  }

                  header.addView(
                      logo,
                      LinearLayout.LayoutParams(0, dp(48), 1f)
                  )

                  val nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  fun item(title: String, page: String): TextView {
                      return label(
                          title,
                          12f,
                          if (active == page) white else muted,
                          active == page
                      ).apply {
                          gravity = Gravity.CENTER
                          setPadding(dp(15), dp(10), dp(15), dp(10))
                          isFocusable = true
                          isClickable = true

                          background = if (active == page) {
                              shape(Color.argb(40, 181, 157, 255), 18, accent, 1)
                          } else {
                              shape(Color.TRANSPARENT, 18)
                          }

                          setOnFocusChangeListener { view, focused ->
                              view.animate()
                                  .scaleX(if (focused) 1.07f else 1f)
                                  .scaleY(if (focused) 1.07f else 1f)
                                  .setDuration(190)
                                  .setInterpolator(DecelerateInterpolator())
                                  .start()

                              view.background = if (focused) {
                                  shape(Color.argb(75, 181, 157, 255), 18, accent, 2)
                              } else if (active == page) {
                                  shape(Color.argb(40, 181, 157, 255), 18, accent, 1)
                              } else {
                                  shape(Color.TRANSPARENT, 18)
                              }
                          }

                          setOnClickListener {
                              if (page == "settings") {
                                  openSystemSettings()
                              } else {
                                  showPage(page)
                              }
                          }
                      }
                  }

                  nav.addView(item("ГЛАВНАЯ", "home"))
                  nav.addView(item("БИБЛИОТЕКА", "library"))
                  nav.addView(item("ИСТОЧНИКИ", "inputs"))
                  nav.addView(item("НАСТРОЙКИ", "settings"))

                  header.addView(nav)

                  val clock = label(
                      SimpleDateFormat("HH:mm", Locale("ru", "RU")).apply {
                          timeZone = TimeZone.getTimeZone("Europe/Moscow")
                      }.format(java.util.Date()),
                      15f,
                      white,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  header.addView(
                      clock,
                      LinearLayout.LayoutParams(dp(78), dp(48))
                  )

                  return header
              }

              private fun openSystemSettings() {
                  try {
                      val intent = Intent(Settings.ACTION_SETTINGS)
                      if (intent.resolveActivity(packageManager) != null) {
                          startActivity(intent)
                      } else {
                          Toast.makeText(
                              this,
                              "Системные настройки недоступны",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Не удалось открыть настройки телевизора",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun sectionTitle(value: String): TextView {
                  return label(value, 12f, muted, true).apply {
                      letterSpacing = 0.14f
                  }
              }

              private fun buildHome() {
                  homePage.removeAllViews()
                  homePage.addView(makeHeader("home"))

                  homePage.addView(
                      View(this),
                      LinearLayout.LayoutParams(1, dp(20))
                  )

                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = gradient(
                          intArrayOf(
                              Color.rgb(60, 53, 112),
                              Color.rgb(35, 35, 75),
                              Color.rgb(20, 25, 47)
                          ),
                          28
                      )
                      setPadding(dp(30), dp(22), dp(30), dp(22))
                      clipChildren = false
                  }

                  val iconHolder = FrameLayout(this).apply {
                      background = shape(
                          Color.argb(65, 255, 255, 255),
                          25
                      )
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                  }

                  heroIcon = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }

                  iconHolder.addView(
                      heroIcon,
                      FrameLayout.LayoutParams(dp(104), dp(104))
                  )

                  hero.addView(
                      iconHolder,
                      LinearLayout.LayoutParams(dp(132), dp(132))
                  )

                  val details = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(28), 0, 0, 0)
                  }

                  heroTitle = label("Добро пожаловать", 29f, white, true)
                  details.addView(heroTitle)

                  heroSubtitle = label(
                      "Ваши приложения — в одном месте",
                      14f,
                      Color.rgb(208, 208, 229)
                  )
                  details.addView(heroSubtitle)

                  details.addView(
                      View(this),
                      LinearLayout.LayoutParams(1, dp(12))
                  )

                  val open = label("ОТКРЫТЬ  ›", 12f, white, true).apply {
                      gravity = Gravity.CENTER
                      background = shape(accentDark, 16)
                      setPadding(dp(20), dp(12), dp(20), dp(12))
                      isFocusable = true
                      isClickable = true

                      setOnFocusChangeListener { view, focused ->
                          view.animate()
                              .scaleX(if (focused) 1.06f else 1f)
                              .scaleY(if (focused) 1.06f else 1f)
                              .setDuration(200)
                              .start()

                          view.background = shape(
                              if (focused) Color.rgb(139, 112, 220)
                              else accentDark,
                              16,
                              if (focused) white else Color.TRANSPARENT,
                              if (focused) 1 else 0
                          )
                      }

                      setOnClickListener { launchSelectedApp() }
                  }

                  details.addView(open, LinearLayout.LayoutParams(
                      dp(142), dp(42)
                  ))

                  hero.addView(details, LinearLayout.LayoutParams(
                      0,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      1f
                  ))

                  homePage.addView(hero, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(205)
                  ))

                  homePage.addView(
                      View(this),
                      LinearLayout.LayoutParams(1, dp(18))
                  )

                  homePage.addView(
                      sectionTitle("ВАШИ ПРИЛОЖЕНИЯ"),
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(28)
                      )
                  )

                  appScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipChildren = false
                      clipToPadding = false
                      setPadding(dp(4), dp(10), dp(30), dp(12))
                  }

                  appRail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      clipChildren = false
                  }

                  firstAppTile = null

                  if (apps.isEmpty()) {
                      appRail.addView(label(
                          "Приложения не найдены",
                          15f,
                          muted
                      ))
                  } else {
                      apps.take(15).forEachIndexed { index, app ->
                          val tile = createAppTile(app, index)

                          appRail.addView(
                              tile,
                              LinearLayout.LayoutParams(dp(138), dp(150)).apply {
                                  marginEnd = dp(15)
                              }
                          )

                          if (index == 0) firstAppTile = tile
                      }
                  }

                  appScroll.addView(appRail)
                  homePage.addView(appScroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(176)
                  ))

                  homePage.addView(
                      View(this),
                      LinearLayout.LayoutParams(1, 0, 1f)
                  )

                  homePage.addView(
                      label(
                          "OK — открыть     •     ВВЕРХ — навигация",
                          11f,
                          muted
                      ),
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(25)
                      )
                  )

                  updateHero()
              }

              private fun createAppTile(
                  app: AppEntry,
                  index: Int
              ): LinearLayout {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      background = shape(
                          Color.argb(115, 37, 41, 68),
                          21
                      )
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      isFocusable = true
                      isClickable = true
                      clipChildren = false
                      clipToPadding = false

                      setOnFocusChangeListener { view, focused ->
                          view.animate()
                              .scaleX(if (focused) 1.075f else 1f)
                              .scaleY(if (focused) 1.075f else 1f)
                              .translationY(if (focused) -dp(5).toFloat() else 0f)
                              .setDuration(230)
                              .setInterpolator(DecelerateInterpolator())
                              .start()

                          view.background = if (focused) {
                              shape(
                                  Color.rgb(56, 49, 91),
                                  21,
                                  accent,
                                  2
                              )
                          } else {
                              shape(Color.argb(115, 37, 41, 68), 21)
                          }

                          if (focused) {
                              selectedApp = index
                              updateHero()
                              appScroll.post {
                                  val left = view.left
                                  val right = view.right
                                  val visibleLeft = appScroll.scrollX
                                  val visibleRight = visibleLeft + appScroll.width

                                  if (right > visibleRight) {
                                      appScroll.smoothScrollTo(
                                          right - appScroll.width + dp(35),
                                          0
                                      )
                                  } else if (left < visibleLeft) {
                                      appScroll.smoothScrollTo(
                                          maxOf(0, left - dp(25)),
                                          0
                                      )
                                  }
                              }
                          }
                      }

                      setOnClickListener {
                          selectedApp = index
                          launchApp(app)
                      }
                  }

                  val icon = ImageView(this).apply {
                      setImageDrawable(app.icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }

                  tile.addView(icon, LinearLayout.LayoutParams(
                      dp(70), dp(70)
                  ))

                  tile.addView(
                      View(this),
                      LinearLayout.LayoutParams(1, dp(10))
                  )

                  val name = label(app.label, 12f, white, true).apply {
                      gravity = Gravity.CENTER
                      maxLines = 2
                      ellipsize = android.text.TextUtils.TruncateAt.END
                  }

                  tile.addView(name, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(34)
                  ))

                  return tile
              }

              private fun updateHero() {
                  if (!::heroTitle.isInitialized) return

                  if (apps.isEmpty()) {
                      heroTitle.text = "Добро пожаловать"
                      heroSubtitle.text = "Ваш телевизор. Ваши правила."
                      return
                  }

                  selectedApp = selectedApp.coerceIn(0, apps.lastIndex)
                  val app = apps[selectedApp]

                  heroTitle.text = app.label
                  heroSubtitle.text = app.packageName
                  heroIcon.setImageDrawable(app.icon)
              }

              private fun launchSelectedApp() {
                  if (apps.isNotEmpty()) {
                      launchApp(apps[selectedApp.coerceIn(0, apps.lastIndex)])
                  }
              }

              private fun launchApp(app: AppEntry) {
                  try {
                      startActivity(app.launchIntent)
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Не удалось открыть ${app.label}",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun buildInputs() {
                  inputsPage.removeAllViews()
                  inputsPage.addView(makeHeader("inputs"))

                  inputsPage.addView(
                      label("ИСТОЧНИКИ", 29f, white, true),
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(65)
                      )
                  )

                  inputsPage.addView(
                      label(
                          "Выберите подключённое устройство",
                          14f,
                          muted
                      )
                  )

                  inputsPage.addView(
                      View(this),
                      LinearLayout.LayoutParams(1, dp(22))
                  )

                  inputScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipChildren = false
                      clipToPadding = false
                      setPadding(dp(5), dp(12), dp(35), dp(20))
                  }

                  inputRail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      clipChildren = false
                  }

                  firstInputTile = null

                  if (inputs.isEmpty()) {
                      inputRail.addView(label(
                          "Телевизор не сообщил HDMI-входы",
                          15f,
                          muted
                      ))
                  } else {
                      inputs.forEachIndexed { index, input ->
                          val tile = createInputTile(input)

                          inputRail.addView(
                              tile,
                              LinearLayout.LayoutParams(dp(220), dp(170)).apply {
                                  marginEnd = dp(18)
                              }
                          )

                          if (index == 0) firstInputTile = tile
                      }
                  }

                  inputScroll.addView(inputRail)

                  inputsPage.addView(
                      inputScroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(210)
                      )
                  )

                  inputsPage.addView(
                      View(this),
                      LinearLayout.LayoutParams(1, 0, 1f)
                  )

                  inputsPage.addView(
                      label(
                          "Переключение выполняет система телевизора",
                          11f,
                          muted
                      ),
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(26)
                      )
                  )
              }

              private fun createInputTile(input: InputEntry): LinearLayout {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      background = shape(
                          Color.argb(125, 38, 43, 75),
                          24
                      )
                      setPadding(dp(18), dp(16), dp(18), dp(16))
                      isFocusable = true
                      isClickable = true
                      clipChildren = false
                      clipToPadding = false

                      setOnFocusChangeListener { view, focused ->
                          view.animate()
                              .scaleX(if (focused) 1.065f else 1f)
                              .scaleY(if (focused) 1.065f else 1f)
                              .translationY(if (focused) -dp(4).toFloat() else 0f)
                              .setDuration(230)
                              .setInterpolator(DecelerateInterpolator())
                              .start()

                          view.background = if (focused) {
                              shape(
                                  Color.rgb(69, 57, 126),
                                  24,
                                  accent,
                                  2
                              )
                          } else {
                              shape(Color.argb(125, 38, 43, 75), 24)
                          }

                          if (focused) {
                              inputScroll.post {
                                  val left = view.left
                                  val right = view.right
                                  val visibleLeft = inputScroll.scrollX
                                  val visibleRight = visibleLeft + inputScroll.width

                                  if (right > visibleRight) {
                                      inputScroll.smoothScrollTo(
                                          right - inputScroll.width + dp(30),
                                          0
                                      )
                                  } else if (left < visibleLeft) {
                                      inputScroll.smoothScrollTo(
                                          maxOf(0, left - dp(20)),
                                          0
                                      )
                                  }
                              }
                          }
                      }

                      setOnClickListener {
                          switchInput(input)
                      }
                  }

                  val symbol = label(
                      if (input.isPlayStation) "PS5" else "HDMI",
                      25f,
                      if (input.isPlayStation) white else accent,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      letterSpacing = 0.07f
                  }

                  val name = label(input.label, 15f, white, true).apply {
                      gravity = Gravity.CENTER
                      maxLines = 2
                  }

                  val type = label(
                      if (input.isPlayStation) "ИГРОВАЯ КОНСОЛЬ" else "ВИДЕОВХОД",
                      10f,
                      muted,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      letterSpacing = 0.07f
                  }

                  tile.addView(symbol, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(58)
                  ))

                  tile.addView(name, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(34)
                  ))

                  tile.addView(type, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(25)
                  ))

                  return tile
              }

              private fun switchInput(input: InputEntry) {
                  try {
                      val uri = TvContract.buildChannelUriForPassthroughInput(
                          input.inputId
                      )
                      startActivity(Intent(Intent.ACTION_VIEW, uri))
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Не удалось открыть ${input.label}",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun buildLibrary() {
                  libraryPage.removeAllViews()
                  libraryPage.addView(makeHeader("library"))

                  libraryPage.addView(
                      label("БИБЛИОТЕКА", 29f, white, true),
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(65)
                      )
                  )

                  libraryPage.addView(
                      label(
                          "Установлено приложений: ${apps.size}",
                          14f,
                          muted
                      )
                  )

                  libraryScroll = ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false
                      clipChildren = false
                      clipToPadding = false
                      setPadding(dp(4), dp(16), dp(12), dp(16))
                  }

                  libraryContent = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      clipChildren = false
                      clipToPadding = false
                  }

                  val columns = 5

                  apps.chunked(columns).forEachIndexed { rowIndex, rowApps ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          clipChildren = false
                          clipToPadding = false
                      }

                      rowApps.forEachIndexed { colIndex, app ->
                          val index = rowIndex * columns + colIndex
                          val tile = createAppTile(app, index)

                          row.addView(
                              tile,
                              LinearLayout.LayoutParams(
                                  0,
                                  dp(145),
                                  1f
                              ).apply {
                                  marginEnd = dp(13)
                                  bottomMargin = dp(13)
                              }
                          )
                      }

                      repeat(columns - rowApps.size) {
                          row.addView(
                              View(this),
                              LinearLayout.LayoutParams(
                                  0,
                                  dp(145),
                                  1f
                              ).apply {
                                  marginEnd = dp(13)
                              }
                          )
                      }

                      libraryContent.addView(row)
                  }

                  if (apps.isEmpty()) {
                      libraryContent.addView(label(
                          "Установленные приложения не найдены",
                          15f,
                          muted
                      ))
                  }

                  libraryScroll.addView(libraryContent)

                  libraryPage.addView(
                      libraryScroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )
              }

              private fun showPage(page: String) {
                  if (page == currentPage) return

                  if (currentPage == "home") {
                      lastHomeFocus = currentFocus
                  }

                  val oldPage = when (currentPage) {
                      "inputs" -> inputsPage
                      "library" -> libraryPage
                      else -> homePage
                  }

                  val newPage = when (page) {
                      "inputs" -> inputsPage
                      "library" -> libraryPage
                      else -> homePage
                  }

                  currentPage = page

                  newPage.animate().cancel()
                  oldPage.animate().cancel()

                  newPage.visibility = View.VISIBLE
                  newPage.alpha = 0f
                  newPage.translationY = dp(18).toFloat()

                  oldPage.animate()
                      .alpha(0f)
                      .translationY(-dp(12).toFloat())
                      .setDuration(170)
                      .setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          oldPage.visibility = View.GONE
                          oldPage.alpha = 1f
                          oldPage.translationY = 0f
                      }
                      .start()

                  newPage.animate()
                      .alpha(1f)
                      .translationY(0f)
                      .setDuration(300)
                      .setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          when (page) {
                              "inputs" -> firstInputTile?.requestFocus()
                                  ?: inputsPage.requestFocus()

                              "library" -> {
                                  val firstRow = libraryContent.getChildAt(0)
                                  if (firstRow is ViewGroup && firstRow.childCount > 0) {
                                      firstRow.getChildAt(0).requestFocus()
                                  } else {
                                      libraryPage.requestFocus()
                                  }
                              }

                              else -> {
                                  if (lastHomeFocus?.requestFocus() != true) {
                                      firstAppTile?.requestFocus()
                                          ?: homePage.requestFocus()
                                  }
                              }
                          }
                      }
                      .start()
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      if (event.keyCode == KeyEvent.KEYCODE_BACK) {
                          if (currentPage != "home") {
                              showPage("home")
                              return true
                          }
                      }
                  }

                  return super.dispatchKeyEvent(event)
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (currentPage != "home") {
                      showPage("home")
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

