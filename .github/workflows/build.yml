name: Build Amethyst Launcher TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate project
        shell: bash
        run: |
          mkdir -p amethyst/app/src/main/java/com/amethyst/launcher

          cat > amethyst/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmethystLauncher"
          include(":app")
          EOF

          cat > amethyst/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > amethyst/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          cat > amethyst/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.amethyst.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.amethyst.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 9
                  versionName '9.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          mkdir -p amethyst/app/src/main/res/values

          cat > amethyst/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AmethystTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#B8A0FF</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowBackground">#080A12</item>
                  <item name="android:navigationBarColor">#080A12</item>
                  <item name="android:statusBarColor">#080A12</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat > amethyst/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="Amethyst"
                  android:theme="@style/AmethystTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:launchMode="singleTask">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > amethyst/app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.tv.TvContract
          import android.media.tv.TvInputInfo
          import android.media.tv.TvInputManager
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale

          class MainActivity : Activity() {

              private val bg = Color.rgb(8, 10, 19)
              private val panel = Color.rgb(20, 24, 39)
              private val purple = Color.rgb(174, 145, 255)
              private val white = Color.rgb(245, 246, 255)
              private val muted = Color.rgb(151, 158, 181)

              private lateinit var root: FrameLayout
              private lateinit var homePage: LinearLayout
              private lateinit var sourcePage: LinearLayout
              private lateinit var libraryPage: LinearLayout
              private lateinit var heroIcon: ImageView
              private lateinit var heroTitle: TextView
              private lateinit var heroSubtitle: TextView
              private lateinit var appRail: LinearLayout
              private lateinit var libraryGrid: LinearLayout
              private lateinit var sourceList: LinearLayout

              private data class AppEntry(
                  val label: String,
                  val packageName: String,
                  val icon: android.graphics.drawable.Drawable,
                  val launchIntent: Intent
              )

              private data class SourceEntry(
                  val label: String,
                  val inputId: String,
                  val isPlayStation: Boolean
              )

              private val apps = mutableListOf<AppEntry>()
              private val sources = mutableListOf<SourceEntry>()
              private var selectedApp = 0
              private var currentPage = "home"
              private var lastHomeFocus: View? = null
              private var firstAppTile: View? = null
              private var firstSourceTile: View? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN

                  loadApps()
                  loadSources()
                  buildInterface()
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun rounded(
                  color: Int,
                  radius: Int,
                  stroke: Int = Color.TRANSPARENT,
                  strokeWidth: Int = 0
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                      if (strokeWidth > 0) {
                          setStroke(dp(strokeWidth), stroke)
                      }
                  }
              }

              private fun gradientBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(
                          Color.rgb(23, 25, 48),
                          Color.rgb(12, 15, 29),
                          Color.rgb(7, 9, 17)
                      )
                  ).apply {
                      cornerRadius = dp(26).toFloat()
                  }
              }

              private fun text(
                  value: String,
                  size: Float,
                  color: Int = white,
                  bold: Boolean = false
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      typeface = if (bold) Typeface.create("sans-serif", Typeface.BOLD)
                      else Typeface.create("sans-serif", Typeface.NORMAL)
                      gravity = Gravity.CENTER_VERTICAL
                  }
              }

              private fun loadApps() {
                  apps.clear()
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)
                  val pm = packageManager
                  val found = pm.queryIntentActivities(intent, 0)

                  val entries = found.mapNotNull { info ->
                      val packageName = info.activityInfo?.packageName ?: return@mapNotNull null
                      if (packageName == this.packageName) return@mapNotNull null
                      val launch = pm.getLaunchIntentForPackage(packageName) ?: return@mapNotNull null
                      AppEntry(
                          info.loadLabel(pm)?.toString() ?: packageName,
                          packageName,
                          info.loadIcon(pm),
                          launch
                      )
                  }.distinctBy { it.packageName }
                      .sortedBy { it.label.lowercase(Locale.getDefault()) }

                  apps.addAll(entries)

                  if (apps.isEmpty()) {
                      val fallback = pm.queryIntentActivities(
                          Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER),
                          0
                      )
                      fallback.mapNotNull { info ->
                          val packageName = info.activityInfo?.packageName ?: return@mapNotNull null
                          if (packageName == this.packageName) return@mapNotNull null
                          val launch = pm.getLaunchIntentForPackage(packageName) ?: return@mapNotNull null
                          AppEntry(
                              info.loadLabel(pm)?.toString() ?: packageName,
                              packageName,
                              info.loadIcon(pm),
                              launch
                          )
                      }.distinctBy { it.packageName }
                          .sortedBy { it.label.lowercase(Locale.getDefault()) }
                          .forEach { apps.add(it) }
                  }
              }

              private fun loadSources() {
                  sources.clear()
                  try {
                      val manager = getSystemService(Context.TV_INPUT_SERVICE) as TvInputManager
                      manager.tvInputList.forEach { input ->
                          if (input.type == TvInputInfo.TYPE_HDMI) {
                              val id = input.id
                              val label = input.loadLabel(this).toString()
                              val isPs = id.contains("HDMI300004", true) ||
                                  (id.contains("HW4", true) && label.contains("PlayStation", true))
                              val display = if (isPs) "PlayStation 5" else label
                              sources.add(SourceEntry(display, id, isPs))
                          }
                      }
                  } catch (_: Exception) {
                      // Some TV firmware restricts TV input enumeration.
                  }

                  sources.sortBy {
                      when {
                          it.isPlayStation -> 3
                          it.inputId.contains("HW2", true) -> 1
                          it.inputId.contains("HW3", true) -> 2
                          it.inputId.contains("HW4", true) -> 3
                          else -> 9
                      }
                  }
              }

              private fun buildInterface() {
                  root = FrameLayout(this).apply {
                      setBackgroundColor(bg)
                      isFocusable = true
                      isFocusableInTouchMode = true
                  }

                  homePage = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(54), dp(28), dp(54), dp(30))
                      background = gradientBackground()
                  }

                  sourcePage = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(54), dp(28), dp(54), dp(30))
                      background = gradientBackground()
                      visibility = View.GONE
                  }

                  libraryPage = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(54), dp(28), dp(54), dp(30))
                      background = gradientBackground()
                      visibility = View.GONE
                  }

                  root.addView(homePage, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))

                  root.addView(sourcePage, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))

                  root.addView(libraryPage, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))

                  buildHome()
                  buildSources()
                  buildLibrary()
                  setContentView(root)

                  root.post {
                      firstAppTile?.requestFocus()
                  }
              }

              private fun makeHeader(active: String): LinearLayout {
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val logo = text("AMETHYST", 19f, white, true)
                  logo.letterSpacing = 0.16f
                  header.addView(logo, LinearLayout.LayoutParams(0, dp(48), 1f))

                  val nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  fun navItem(label: String, key: String): TextView {
                      return text(label, 13f, if (active == key) white else muted, active == key).apply {
                          gravity = Gravity.CENTER
                          setPadding(dp(18), dp(10), dp(18), dp(10))
                          isFocusable = true
                          isClickable = true
                          background = if (active == key) rounded(
                              Color.argb(35, 174, 145, 255), 18, purple, 1
                          ) else rounded(Color.TRANSPARENT, 18)
                          setOnFocusChangeListener { view, focused ->
                              view.background = if (focused) rounded(
                                  Color.argb(55, 174, 145, 255), 18, purple, 2
                              ) else if (active == key) rounded(
                                  Color.argb(35, 174, 145, 255), 18, purple, 1
                              ) else rounded(Color.TRANSPARENT, 18)
                              view.scaleX = if (focused) 1.05f else 1f
                              view.scaleY = if (focused) 1.05f else 1f
                          }
                          setOnClickListener {
                              when (key) {
                                  "home" -> showPage("home")
                                  "library" -> showPage("library")
                                  "sources" -> showPage("sources")
                              }
                          }
                      }
                  }

                  nav.addView(navItem("HOME", "home"))
                  nav.addView(navItem("LIBRARY", "library"))
                  nav.addView(navItem("INPUTS", "sources"))

                  header.addView(nav)

                  val clock = text(
                      android.text.format.DateFormat.format("HH:mm", System.currentTimeMillis()).toString(),
                      15f, white, true
                  )
                  clock.gravity = Gravity.CENTER
                  clock.setPadding(dp(24), 0, 0, 0)
                  header.addView(clock, LinearLayout.LayoutParams(dp(82), dp(48)))

                  return header
              }

              private fun buildHome() {
                  homePage.removeAllViews()
                  homePage.addView(makeHeader("home"))

                  val spacer = View(this)
                  homePage.addView(spacer, LinearLayout.LayoutParams(1, dp(22)))

                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = rounded(Color.argb(115, 31, 34, 59), 26)
                      setPadding(dp(30), dp(22), dp(30), dp(22))
                      elevation = dp(3).toFloat()
                  }

                  val iconFrame = FrameLayout(this).apply {
                      background = rounded(Color.argb(90, 174, 145, 255), 23)
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                  }

                  heroIcon = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }
                  iconFrame.addView(heroIcon, FrameLayout.LayoutParams(dp(112), dp(112)))

                  hero.addView(iconFrame, LinearLayout.LayoutParams(dp(140), dp(140)))

                  val details = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(30), 0, 0, 0)
                  }

                  val eyebrow = text("CONTINUE YOUR EXPERIENCE", 11f, purple, true)
                  eyebrow.letterSpacing = 0.12f
                  details.addView(eyebrow)

                  heroTitle = text("Welcome to Amethyst", 30f, white, true)
                  details.addView(heroTitle)

                  heroSubtitle = text(
                      "Your games and entertainment, in one place.",
                      15f, muted
                  )
                  details.addView(heroSubtitle)

                  val launch = text("OPEN  ›", 13f, white, true).apply {
                      gravity = Gravity.CENTER
                      background = rounded(Color.rgb(104, 78, 180), 15)
                      setPadding(dp(22), dp(12), dp(22), dp(12))
                      isFocusable = true
                      isClickable = true
                      setOnFocusChangeListener { v, focused ->
                          v.background = rounded(
                              if (focused) Color.rgb(139, 108, 226) else Color.rgb(104, 78, 180),
                              15,
                              if (focused) white else Color.TRANSPARENT,
                              if (focused) 1 else 0
                          )
                          v.scaleX = if (focused) 1.04f else 1f
                          v.scaleY = if (focused) 1.04f else 1f
                      }
                      setOnClickListener { launchSelectedApp() }
                  }

                  details.addView(View(this), LinearLayout.LayoutParams(1, dp(13)))
                  details.addView(launch, LinearLayout.LayoutParams(dp(140), dp(44)))

                  hero.addView(details, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))

                  homePage.addView(hero, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(210)
                  ))

                  val railTitle = text("YOUR APPS", 13f, muted, true).apply {
                      letterSpacing = 0.15f
                  }
                  homePage.addView(railTitle, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(55)
                  ))

                  val scroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      clipToPadding = false
                      setPadding(0, dp(4), 0, dp(12))
                  }

                  appRail = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  if (apps.isEmpty()) {
                      val empty = text(
                          "No apps found. Open Library to refresh your app list.",
                          15f, muted
                      )
                      appRail.addView(empty)
                  } else {
                      apps.take(12).forEachIndexed { index, app ->
                          val tile = createAppTile(app, index, false)
                          appRail.addView(tile, LinearLayout.LayoutParams(dp(142), dp(154)).apply {
                              marginEnd = dp(16)
                          })
                          if (index == 0) firstAppTile = tile
                      }
                  }

                  scroll.addView(appRail)
                  homePage.addView(scroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(178)
                  ))

                  val footer = text(
                      "SELECT  Open     •     UP  Inputs     •     HOME  Return",
                      11f, muted
                  )
                  homePage.addView(View(this), LinearLayout.LayoutParams(1, 0, 1f))
                  homePage.addView(footer, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(28)
                  ))

                  updateHero()
              }

              private fun createAppTile(app: AppEntry, index: Int, compact: Boolean): View {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      background = rounded(Color.argb(105, 31, 35, 57), 20)
                      isFocusable = true
                      isClickable = true
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      tag = index

                      setOnFocusChangeListener { view, focused ->
                          view.background = if (focused) rounded(
                              Color.argb(190, 55, 48, 91), 20, purple, 2
                          ) else rounded(Color.argb(105, 31, 35, 57), 20)
                          view.scaleX = if (focused) 1.07f else 1f
                          view.scaleY = if (focused) 1.07f else 1f
                          view.elevation = if (focused) dp(9).toFloat() else 0f
                          if (focused) {
                              selectedApp = index
                              updateHero()
                          }
                      }

                      setOnClickListener {
                          selectedApp = index
                          launchApp(app)
                      }
                  }

                  val icon = ImageView(this).apply {
                      setImageDrawable(app.icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }
                  tile.addView(icon, LinearLayout.LayoutParams(dp(68), dp(68)))

                  val label = text(app.label, 12f, white, true).apply {
                      gravity = Gravity.CENTER
                      maxLines = 2
                      ellipsize = android.text.TextUtils.TruncateAt.END
                  }
                  tile.addView(View(this), LinearLayout.LayoutParams(1, dp(9)))
                  tile.addView(label, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(34)
                  ))

                  return tile
              }

              private fun updateHero() {
                  if (apps.isEmpty()) {
                      heroTitle.text = "Welcome to Amethyst"
                      heroSubtitle.text = "Your TV, your way."
                      return
                  }
                  selectedApp = selectedApp.coerceIn(0, apps.lastIndex)
                  val app = apps[selectedApp]
                  heroTitle.text = app.label
                  heroSubtitle.text = app.packageName
                  heroIcon.setImageDrawable(app.icon)
              }

              private fun launchSelectedApp() {
                  if (apps.isEmpty()) return
                  launchApp(apps[selectedApp.coerceIn(0, apps.lastIndex)])
              }

              private fun launchApp(app: AppEntry) {
                  try {
                      startActivity(app.launchIntent)
                  } catch (_: Exception) {
                      Toast.makeText(this, "Unable to open ${app.label}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun buildSources() {
                  sourcePage.removeAllViews()
                  sourcePage.addView(makeHeader("sources"))

                  val title = text("INPUTS", 30f, white, true)
                  sourcePage.addView(title, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(75)
                  ))

                  val subtitle = text(
                      "Choose an HDMI source connected to your TV.",
                      14f, muted
                  )
                  sourcePage.addView(subtitle)

                  sourcePage.addView(View(this), LinearLayout.LayoutParams(1, dp(20)))

                  sourceList = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  if (sources.isEmpty()) {
                      sourceList.addView(text(
                          "No HDMI inputs were reported by the TV.",
                          15f, muted
                      ))
                  } else {
                      sources.forEachIndexed { index, source ->
                          val tile = createSourceTile(source, index)
                          sourceList.addView(tile, LinearLayout.LayoutParams(dp(225), dp(170)).apply {
                              marginEnd = dp(20)
                          })
                          if (index == 0) firstSourceTile = tile
                      }
                  }

                  sourcePage.addView(sourceList, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(190)
                  ))

                  val note = text(
                      "HDMI switching is handled by the TV input service.",
                      12f, muted
                  )
                  sourcePage.addView(View(this), LinearLayout.LayoutParams(1, 0, 1f))
                  sourcePage.addView(note, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(30)
                  ))
              }

              private fun createSourceTile(source: SourceEntry, index: Int): View {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(18), dp(18), dp(18), dp(18))
                      background = rounded(Color.argb(110, 31, 35, 57), 22)
                      isFocusable = true
                      isClickable = true
                      id = View.generateViewId()
                      tag = source.inputId

                      setOnFocusChangeListener { view, focused ->
                          view.background = if (focused) rounded(
                              Color.argb(195, 55, 48, 91), 22, purple, 2
                          ) else rounded(Color.argb(110, 31, 35, 57), 22)
                          view.scaleX = if (focused) 1.06f else 1f
                          view.scaleY = if (focused) 1.06f else 1f
                          view.elevation = if (focused) dp(8).toFloat() else 0f
                      }

                      setOnClickListener { switchInput(source) }
                  }

                  val symbol = text(
                      if (source.isPlayStation) "PS5" else "HDMI",
                      if (source.isPlayStation) 24f else 20f,
                      if (source.isPlayStation) white else purple,
                      true
                  ).apply {
                      gravity = Gravity.CENTER
                      letterSpacing = 0.08f
                  }

                  val label = text(source.label, 15f, white, true).apply {
                      gravity = Gravity.CENTER
                      maxLines = 2
                  }

                  val number = text(
                      if (source.isPlayStation) "CONNECTED CONSOLE" else "VIDEO INPUT",
                      10f, muted, true
                  ).apply {
                      gravity = Gravity.CENTER
                      letterSpacing = 0.08f
                  }

                  tile.addView(symbol, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(55)
                  ))
                  tile.addView(label, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(35)
                  ))
                  tile.addView(number, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(25)
                  ))

                  return tile
              }

              private fun switchInput(source: SourceEntry) {
                  try {
                      val uri = TvContract.buildChannelUriForPassthroughInput(source.inputId)
                      val intent = Intent(Intent.ACTION_VIEW, uri)
                      startActivity(intent)
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "The TV could not open ${source.label}",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun buildLibrary() {
                  libraryPage.removeAllViews()
                  libraryPage.addView(makeHeader("library"))

                  libraryPage.addView(text("LIBRARY", 30f, white, true),
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(70)))

                  libraryPage.addView(text(
                      "${apps.size} installed applications",
                      14f, muted
                  ))

                  val scroll = ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false
                      clipToPadding = false
                      setPadding(0, dp(18), 0, dp(12))
                  }

                  libraryGrid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val columns = 5
                  apps.chunked(columns).forEachIndexed { rowIndex, rowApps ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }

                      rowApps.forEachIndexed { colIndex, app ->
                          val absoluteIndex = rowIndex * columns + colIndex
                          val tile = createAppTile(app, absoluteIndex, true)
                          row.addView(tile, LinearLayout.LayoutParams(
                              0, dp(145), 1f
                          ).apply {
                              marginEnd = dp(12)
                              bottomMargin = dp(12)
                          })
                      }

                      repeat(columns - rowApps.size) {
                          row.addView(View(this), LinearLayout.LayoutParams(
                              0, dp(145), 1f
                          ))
                      }

                      libraryGrid.addView(row)
                  }

                  if (apps.isEmpty()) {
                      libraryGrid.addView(text(
                          "No applications found.",
                          15f, muted
                      ))
                  }

                  scroll.addView(libraryGrid)
                  libraryPage.addView(scroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ))
              }

              private fun showPage(page: String) {
                  if (page == currentPage) return

                  if (currentPage == "home") {
                      lastHomeFocus = currentFocus
                  }

                  val old = when (currentPage) {
                      "sources" -> sourcePage
                      "library" -> libraryPage
                      else -> homePage
                  }

                  val next = when (page) {
                      "sources" -> sourcePage
                      "library" -> libraryPage
                      else -> homePage
                  }

                  currentPage = page
                  next.visibility = View.VISIBLE
                  next.alpha = 0f
                  next.translationY = dp(24).toFloat()

                  old.animate()
                      .alpha(0f)
                      .translationY(-dp(18).toFloat())
                      .setDuration(180)
                      .setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          old.visibility = View.GONE
                          old.translationY = 0f
                      }
                      .start()

                  next.animate()
                      .alpha(1f)
                      .translationY(0f)
                      .setDuration(300)
                      .setInterpolator(DecelerateInterpolator())
                      .withEndAction {
                          when (page) {
                              "sources" -> firstSourceTile?.requestFocus()
                                  ?: sourcePage.requestFocus()
                              "library" -> libraryGrid.getChildAt(0)
                                  ?.let { (it as? ViewGroup)?.getChildAt(0)?.requestFocus() }
                              else -> lastHomeFocus?.requestFocus()
                                  ?: firstAppTile?.requestFocus()
                          }
                      }
                      .start()
              }

              override fun onBackPressed() {
                  if (currentPage != "home") {
                      showPage("home")
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      when (event.keyCode) {
                          KeyEvent.KEYCODE_BACK -> {
                              if (currentPage != "home") {
                                  showPage("home")
                                  return true
                              }
                          }

                          KeyEvent.KEYCODE_DPAD_UP -> {
                              if (currentPage == "sources") {
                                  showPage("home")
                                  return true
                              }
                          }

                          KeyEvent.KEYCODE_DPAD_DOWN -> {
                              if (currentPage == "home" && currentFocus === firstAppTile) {
                                  showPage("sources")
                                  return true
                              }
                          }
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }
          }
          EOF

      - name: Build APK
        working-directory: amethyst
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Launcher-9.0
          path: amethyst/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
