name: Build Amethyst Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Create PlayStation-style launcher
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/java/com/amethyst/launcher
          cat > app/src/main/java/com/amethyst/launcher/MainActivity.kt <<'EOF'
          package com.amethyst.launcher

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var clock: TextView
              private lateinit var status: TextView
              private lateinit var appsRow: LinearLayout
              private lateinit var scroll: HorizontalScrollView
              private val cards = mutableListOf<View>()
              private var selected = 0

              private val bg = Color.rgb(9, 13, 29)
              private val panel = Color.rgb(24, 34, 62)
              private val accent = Color.rgb(91, 164, 255)

              private fun dp(v: Int): Int =
                  (v * resources.displayMetrics.density).toInt()

              private fun rounded(color: Int, radius: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  buildUI()
                  updateClock()
                  handler.postDelayed(clockUpdater, 1000)
              }

              private val clockUpdater = object : Runnable {
                  override fun run() {
                      updateClock()
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun updateClock() {
                  if (!::clock.isInitialized) return
                  val now = java.text.SimpleDateFormat(
                      "HH:mm", java.util.Locale.getDefault()
                  ).format(java.util.Date())
                  clock.text = now
                  status.text = networkStatus()
              }

              private fun networkStatus(): String {
                  val cm = getSystemService(CONNECTIVITY_SERVICE)
                      as ConnectivityManager
                  val network = cm.activeNetwork ?: return "● Offline"
                  val caps = cm.getNetworkCapabilities(network)
                  return if (caps?.hasCapability(
                      NetworkCapabilities.NET_CAPABILITY_INTERNET
                  ) == true) "● Online" else "● Offline"
              }

              private fun buildUI() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(34), dp(20), dp(34), dp(20))
                      setBackgroundColor(bg)
                      isFocusable = true
                  }

                  val top = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      orientation = LinearLayout.HORIZONTAL
                  }

                  val brand = TextView(this).apply {
                      text = "AMETHYST"
                      textSize = 21f
                      letterSpacing = 0.18f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  top.addView(brand, LinearLayout.LayoutParams(0, -2, 1f))

                  status = TextView(this).apply {
                      textSize = 13f
                      setTextColor(Color.rgb(120, 210, 170))
                  }
                  top.addView(status)

                  clock = TextView(this).apply {
                      textSize = 23f
                      setTextColor(Color.WHITE)
                      setPadding(dp(22), 0, 0, 0)
                  }
                  top.addView(clock)
                  root.addView(top)

                  val welcome = TextView(this).apply {
                      text = "Добро пожаловать"
                      textSize = 29f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, dp(32), 0, dp(5))
                  }
                  root.addView(welcome)

                  val subtitle = TextView(this).apply {
                      text = "Выберите приложение"
                      textSize = 15f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 0, 0, dp(20))
                  }
                  root.addView(subtitle)

                  scroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      isFocusable = false
                  }

                  appsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  scroll.addView(appsRow)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, dp(205)))

                  val footer = TextView(this).apply {
                      text = "← → Навигация     OK Запуск     BACK Главный экран"
                      textSize = 12f
                      setTextColor(Color.rgb(135, 150, 180))
                      setPadding(0, dp(22), 0, 0)
                  }
                  root.addView(footer)

                  setContentView(root)
                  addSettingsCard()
                  loadApps()
              }

              private fun makeCard(
                  title: String,
                  subtitle: String,
                  icon: android.graphics.drawable.Drawable?,
                  action: () -> Unit
              ): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(14), dp(12), dp(14))
                      background = rounded(panel, 18)
                      isFocusable = true
                      isFocusableInTouchMode = true
                      elevation = dp(3).toFloat()
                  }

                  val image = ImageView(this).apply {
                      if (icon != null) setImageDrawable(icon)
                      else setImageResource(android.R.drawable.sym_def_app_icon)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }
                  card.addView(image, LinearLayout.LayoutParams(dp(66), dp(66)))

                  val name = TextView(this).apply {
                      text = title
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      maxLines = 1
                      setPadding(0, dp(13), 0, dp(3))
                  }
                  card.addView(name)

                  val hint = TextView(this).apply {
                      text = subtitle
                      textSize = 11f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      maxLines = 1
                  }
                  card.addView(hint)

                  card.setOnFocusChangeListener { view, focused ->
                      view.animate().scaleX(if (focused) 1.07f else 1f)
                          .scaleY(if (focused) 1.07f else 1f)
                          .setDuration(140).start()
                      view.background = rounded(
                          if (focused) Color.rgb(43, 75, 130) else panel,
                          18
                      )
                      if (focused) {
                          selected = cards.indexOf(view).coerceAtLeast(0)
                          scroll.smoothScrollTo(view.left - dp(20), 0)
                      }
                  }

                  card.setOnClickListener { action() }
                  card.setOnKeyListener { _, key, event ->
                      if (event.action == KeyEvent.ACTION_DOWN &&
                          (key == KeyEvent.KEYCODE_DPAD_CENTER ||
                           key == KeyEvent.KEYCODE_ENTER)) {
                          action()
                          true
                      } else false
                  }

                  cards.add(card)
                  appsRow.addView(card, LinearLayout.LayoutParams(dp(145), dp(185)).apply {
                      marginEnd = dp(15)
                  })
                  return card
              }

              private fun addSettingsCard() {
                  makeCard("Настройки", "Система и Wi-Fi",
                      getDrawable(android.R.drawable.ic_menu_preferences)) {
                      try {
                          startActivity(Intent(android.provider.Settings.ACTION_SETTINGS))
                      } catch (_: Exception) {}
                  }
              }

              private fun loadApps() {
                  val pm = packageManager
                  val found = linkedMapOf<String, android.content.pm.ResolveInfo>()

                  val actions = listOf(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER),
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  )

                  for (intent in actions) {
                      try {
                          for (info in pm.queryIntentActivities(intent, 0)) {
                              val pkg = info.activityInfo.packageName
                              if (pkg != packageName) found[pkg] = info
                          }
                      } catch (_: Exception) {}
                  }

                  val sorted = found.values.sortedBy {
                      it.loadLabel(pm).toString().lowercase()
                  }

                  for (info in sorted) {
                      val label = info.loadLabel(pm).toString()
                      val icon = info.loadIcon(pm)
                      makeCard(label, "Приложение", icon) {
                          try {
                              val launch = pm.getLaunchIntentForPackage(
                                  info.activityInfo.packageName
                              )
                              if (launch != null) startActivity(launch)
                              else startActivity(Intent().apply {
                                  component = android.content.ComponentName(
                                      info.activityInfo.packageName,
                                      info.activityInfo.name
                                  )
                              })
                          } catch (_: Exception) {}
                      }
                  }

                  if (cards.isNotEmpty()) {
                      cards[0].requestFocus()
                  }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      buildUI()
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Launcher-PS-Edition
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
